nt-numeric:tabular-nums; min-width:100px; text-align:right; font-size:12.5px; }\n  .plazo.done .nombre { color:var(--muted); }\n  .plazo.done .cuenta { color:var(--verde); font-weight:600; }\n  .fund { font-size:11px; color:var(--faint); }\n  .acciones { margin-top:12px; display:flex; gap:8px; }\n  .acciones button { padding:5px 11px; font-size:12.5px; }\n  .empty { text-align:center; color:var(--muted); padding:44px 20px; background:var(--sidebar);\n    border:1px solid var(--line); border-radius:8px; }\n  \u002F* form *\u002F\n  .form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px;\n    box-shadow:0 4px 18px rgba(15,15,15,.06); }\n  .form.hidden { display:none; }\n  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }\n  .field { display:flex; flex-direction:column; gap:5px; }\n  .field.full { grid-column:1 \u002F -1; }\n  label { font-size:12px; color:var(--muted); font-weight:500; }\n  input, select { font:inherit; padding:7px 10px; border:1px solid var(--line2); border-radius:6px;\n    background:#fff; color:var(--ink); font-size:14px; }\n  input:focus, select:focus { outline:none; border-color:#b6b6b2; box-shadow:0 0 0 3px rgba(55,53,47,.07); }\n  .check { flex-direction:row; align-items:center; gap:8px; }\n  .check input { width:16px; height:16px; }\n  .hint { font-size:11.5px; color:var(--faint); margin-top:2px; }\n  .sub { grid-column:1 \u002F -1; border-top:1px solid var(--line); margin-top:6px; padding-top:12px;\n    font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }\n  .form-actions { display:flex; gap:8px; margin-top:16px; }\n  .aviso-ia { grid-column:1\u002F-1; background:var(--ambar-bg); color:#7a531a; border:1px solid #eed6a8;\n    border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:2px; }\n  .aviso-error { grid-column:1\u002F-1; background:var(--rojo-bg); color:var(--rojo); border:1px solid #eec2ba;\n    border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:2px; }\n  .aviso-error ul { margin:5px 0 0; padding-left:18px; }\n  \u002F* filas repetibles *\u002F\n  .rep-row { border:1px solid var(--line2); border-radius:8px; padding:12px; margin-bottom:9px;\n    display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--sidebar); }\n  .rep-row .rowtop { grid-column:1\u002F-1; display:flex; gap:8px; align-items:center; }\n  .rep-row .rowtop select { flex:1; }\n  .rep-row .rm { padding:6px 11px; font-size:12.5px; }\n  .rep-empty { font-size:12.5px; color:var(--faint); margin-bottom:9px; }\n  \u002F* subir documento *\u002F\n  .upl { display:none; }\n  \u002F* calendario *\u002F\n  .cal { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:6px 0 8px; }\n  .cal-body { display:grid; grid-template-columns:1fr 200px; gap:20px; }\n  .cal-main {}\n  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:6px; flex-wrap:wrap; }\n  .cal-head .cal-mes { font-family:var(--sans); font-weight:700; font-size:18px; text-transform:capitalize; }\n  .cal-head button { padding:4px 9px; font-size:13px; box-shadow:none; }\n  .cal-nav { display:flex; gap:3px; }\n  .cal-head-mid { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }\n  .cal-head-mid input[type=month] { font:inherit; padding:4px 8px; border:1px solid var(--line2); border-radius:6px; font-size:12.5px; }\n  .cal-head-mid button { padding:4px 9px; font-size:12px; }\n  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }\n  .cal-dow { font-size:10.5px; color:var(--faint); text-align:center; padding-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }\n  .cal-cell { position:relative; aspect-ratio:1\u002F1; display:flex; flex-direction:column; align-items:center;\n    justify-content:center; border-radius:7px; font-size:12.5px; gap:3px; color:var(--ink); }\n  .cal-cell.cal-empty { visibility:hidden; }\n  .cal-cell.cal-has { cursor:pointer; }\n  .cal-cell.cal-has:hover { background:var(--hover); }\n  .cal-cell.cal-hoy .cal-num { background:var(--accent); color:#fff; border-radius:50%;\n    width:23px; height:23px; display:flex; align-items:center; justify-content:center; font-weight:600; }\n  .cal-num { line-height:1; }\n  .cal-dots { display:flex; gap:2px; }\n  .cal-mdot { width:6px; height:6px; border-radius:50%; }\n  .cal-mdot.warn { box-shadow:0 0 0 1.5px var(--rojo); }\n  .cal-mdot.soon { box-shadow:0 0 0 1.5px var(--ambar); }\n  .cal-more { font-size:8.5px; color:var(--faint); }\n  .cal-detalle { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }\n  .cal-detalle-fecha { font-size:13px; font-weight:600; margin-bottom:7px; text-transform:capitalize; }\n  .cal-detalle-item { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; }\n  .cal-hint { font-size:12.5px; color:var(--faint); }\n  .cal-legend { border-left:1px solid var(--line); padding-left:18px; }\n  .cal-legend h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin:0 0 10px; font-weight:600; }\n  .cal-legend-item { display:flex; align-items:flex-start; gap:8px; font-size:12.5px; margin-bottom:10px; }\n  .cal-legend-item .txt { line-height:1.35; }\n  .cal-legend-item .txt .fecha-mini { display:block; font-size:10.5px; color:var(--faint); margin-top:1px; }\n  .cal-legend-sw { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:3px; }\n  .cal-legend-sw.warn { box-shadow:0 0 0 1.5px var(--rojo); }\n  .cal-legend-sw.soon { box-shadow:0 0 0 1.5px var(--ambar); }\n  .cal-legend-sev { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); }\n  .cal-legend-sev div { display:flex; align-items:center; gap:6px; margin-bottom:5px; }\n  .cal-resumen { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:4px; }\n  .cal-resumen-row { display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:7px; }\n  .cal-resumen-row .num { margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }\n  #calResumen .cal-resumen-row:first-child .dot { background:#191919; }\n  a { color:var(--ink); }\n  a:hover { color:var(--muted); }\n  @media (max-width:1000px){\n    .wrap { max-width:100%; padding:36px 28px 80px; }\n  }\n  @media (max-width:720px){\n    header .page-head { gap:16px; }\n    .head-divider { display:none; }\n    header h1 { font-size:30px; }\n    .brand-lockup img { height:48px; }\n    .wrap { padding:28px 20px 70px; }\n  }\n  @media (max-width:640px){\n    .grid{grid-template-columns:1fr} .rep-row{grid-template-columns:1fr}\n    .cal-body{grid-template-columns:1fr}\n    .cal-legend{border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:14px;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"main\">\n<div class=\"wrap\">\n  <header>\n    <div class=\"page-head\">\n      <div class=\"brand-lockup\">\n        <img src=\"c02408d3-bd17-472c-b5c0-72fa290e80e6\" alt=\"C\u00c9NECA \u2014 firma jur\u00eddica\">\n      <\u002Fdiv>\n      <div class=\"head-divider\"><\u002Fdiv>\n      <h1>Control de marcas<\u002Fh1>\n    <\u002Fdiv>\n    <p>Capturas lo esencial; los plazos de la LFPPI se calculan y vigilan solos.<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"stats\" id=\"stats\"><\u002Fdiv>\n  <p class=\"leyenda\">Urgente: \u226430 d\u00edas o plazo base ya vencido (a\u00fan salvable si es prorrogable) \u00b7 Pr\u00f3ximo: \u226490 d\u00edas \u00b7 umbrales de vigilancia, no son plazos de la ley. Los c\u00f3mputos en meses\u002Fa\u00f1os van de fecha a fecha incluyendo inh\u00e1biles (Art. 21); ning\u00fan plazo de este tablero se cuenta hoy en d\u00edas h\u00e1biles.<\u002Fp>\n\n  <div class=\"cal\" id=\"sec-cal\">\n    <div class=\"cal-body\">\n      <div class=\"cal-main\">\n        <div class=\"cal-head\">\n          <div class=\"cal-nav\">\n            <button id=\"calPrevY\" title=\"A\u00f1o anterior\">\u00ab<\u002Fbutton>\n            <button id=\"calPrev\" title=\"Mes anterior\">\u2039<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"cal-head-mid\">\n            <span class=\"cal-mes\" id=\"calMes\"><\u002Fspan>\n            <input type=\"month\" id=\"calPicker\" title=\"Ir a mes\">\n            <button id=\"calHoy\">Hoy<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"cal-nav\">\n            <button id=\"calNext\" title=\"Mes siguiente\">\u203a<\u002Fbutton>\n            <button id=\"calNextY\" title=\"A\u00f1o siguiente\">\u00bb<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cal-grid\" id=\"calGrid\"><\u002Fdiv>\n        <div class=\"cal-detalle\" id=\"calDetalle\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cal-legend\">\n        <h3>Resumen<\u002Fh3>\n        <div id=\"calResumen\"><\u002Fdiv>\n        <h3 style=\"margin-top:16px\">Este mes<\u002Fh3>\n        <div id=\"calLegendList\"><\u002Fdiv>\n        <div class=\"cal-legend-sev\">\n          <div><span class=\"cal-mdot warn\" style=\"background:var(--gris)\"><\u002Fspan> contorno rojo = urgente<\u002Fdiv>\n          <div><span class=\"cal-mdot soon\" style=\"background:var(--gris)\"><\u002Fspan> contorno \u00e1mbar = pr\u00f3ximo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bar\" id=\"sec-cartera\">\n    <h2>Cartera<\u002Fh2>\n    <div class=\"bar-btns\">\n      <span id=\"gSyncStatus\" style=\"font-size:12px;color:var(--muted);align-self:center;margin-right:4px\"><\u002Fspan>\n      <a id=\"gOpenSheet\" href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"display:none;font-size:12px;align-self:center;color:var(--muted);text-decoration:underline;margin-right:8px\">Abrir en Google Sheets \u2197<\u002Fa>\n      <button id=\"btnSubir\">\ud83d\udcce Agregar desde documento<\u002Fbutton>\n      <button id=\"btnExportarExcel\">\u2b07\ufe0f Exportar copia (.xlsx)<\u002Fbutton>\n      <button class=\"primary\" id=\"btnNueva\">+ Agregar marca<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"buscador-wrap\"><input id=\"buscador\" type=\"text\" placeholder=\"Buscar por nombre o titular\u2026\"><\u002Fdiv>\n  <div class=\"filtros\" id=\"filtros\"><\u002Fdiv>\n  <input class=\"upl\" type=\"file\" id=\"filePicker\" accept=\"image\u002F*,.pdf\">\n\n  <div id=\"gAuthGate\" style=\"position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;text-align:center;padding:24px\">\n    <div style=\"font-family:var(--sans);font-size:22px;font-weight:700;color:var(--ink)\">Control de marcas \u00b7 Ceneca<\u002Fdiv>\n    <div style=\"color:var(--muted);font-size:14px;max-width:360px\">Con\u00e9ctate con tu cuenta de Google del equipo para ver y editar la cartera compartida.<\u002Fdiv>\n    <button id=\"gSignIn\" class=\"primary\" style=\"padding:10px 20px;font-size:14px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer\">Conectar con Google<\u002Fbutton>\n    <div id=\"gAuthMsg\" style=\"color:var(--muted);font-size:12px;min-height:16px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"form hidden\" id=\"form\">\n    <div id=\"avisoIA\"><\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"field full\"><label>Signo distintivo<\u002Flabel><input id=\"f_signo\" placeholder=\"Nombre de la marca\"><\u002Fdiv>\n      <div class=\"field\"><label>Tipo<\u002Flabel>\n        <select id=\"f_tipo\">\n          <option>Marca<\u002Foption>\n          <option>Aviso comercial<\u002Foption>\n          <option>Nombre comercial<\u002Foption>\n        <\u002Fselect>\n        <span class=\"hint\">Mismos plazos legales en los tres casos (Art. 204, 211 y transitorio D\u00e9cimo Primero) \u2014 solo cambia el nombre del tr\u00e1mite.<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>Clasificaci\u00f3n<\u002Flabel>\n        <select id=\"f_subtipo\">\n          <option value=\"\">Sin especificar<\u002Foption>\n          <option>Nominativa<\u002Foption>\n          <option>Innominada<\u002Foption>\n          <option>Mixta<\u002Foption>\n        <\u002Fselect>\n        <span class=\"hint\">Nominativa: solo palabra(s). Innominada: solo dise\u00f1o\u002Flogo. Mixta: palabra + dise\u00f1o.<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>Titular<\u002Flabel><input id=\"f_titular\" placeholder=\"Nombre del titular\"><\u002Fdiv>\n      <div class=\"field\"><label>Clase<\u002Flabel><input id=\"f_clase\" placeholder=\"Ej. 35\" inputmode=\"numeric\"><\u002Fdiv>\n      <div class=\"field\"><label>Estatus<\u002Flabel>\n        <select id=\"f_estatus\"><option value=\"En tr\u00e1mite\">En tr\u00e1mite<\u002Foption><option value=\"Registrada\">Registrada<\u002Foption><option value=\"Rechazada\">Rechazada<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label>Fecha de rechazo<\u002Flabel><input id=\"f_fechaRechazo\" type=\"date\">\n        <span class=\"hint\">Solo aplica si el estatus es \"Rechazada\".<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><label>No. de expediente<\u002Flabel><input id=\"f_exp\" placeholder=\"Opcional\"><\u002Fdiv>\n      <div class=\"field\"><label>No. de registro<\u002Flabel><input id=\"f_reg\" placeholder=\"Opcional\"><\u002Fdiv>\n      <div class=\"field\"><label>Fecha de solicitud<\u002Flabel><input id=\"f_solicitud\" type=\"date\"><\u002Fdiv>\n      <div class=\"field\"><label id=\"lbl_otorg\">Fecha de otorgamiento<\u002Flabel><input id=\"f_otorg\" type=\"date\">\n        <span class=\"hint\">Al llenarla se activan los plazos de vida (DU, vigencia, renovaci\u00f3n).<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sub\">Oficios del IMPI \u00b7 cada uno corre su propio plazo (2 + 2 meses)<\u002Fdiv>\n      <div class=\"field full\" id=\"oficios_box\"><\u002Fdiv>\n      <div class=\"field full\"><button type=\"button\" id=\"btnAddOficio\">+ Agregar oficio<\u002Fbutton><\u002Fdiv>\n\n      <div class=\"sub\">Declaraci\u00f3n de uso (3er a\u00f1o \u00b7 Art. 233 \u00b7 evento \u00fanico, no se repite en renovaciones)<\u002Fdiv>\n      <div class=\"field check full\"><input type=\"checkbox\" id=\"f_du\"><label style=\"color:var(--ink)\">Declaraci\u00f3n de uso ya presentada<\u002Flabel><\u002Fdiv>\n      <div class=\"field\"><label>Fecha de presentaci\u00f3n de la DU<\u002Flabel><input id=\"f_dufecha\" type=\"date\">\n        <span class=\"hint\">Si marcas la DU y la dejas vac\u00eda, se toma hoy.<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sub\">Renovaciones (Art. 178\u002F204\u002F211\u002F237) \u00b7 cada una suma otro ciclo de 10 a\u00f1os, contiguo al anterior<\u002Fdiv>\n      <div class=\"field full\" id=\"renov_box\"><\u002Fdiv>\n      <div class=\"field full\"><button type=\"button\" id=\"btnAddRenov\">+ Agregar renovaci\u00f3n<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"form-actions\">\n      <button class=\"primary\" id=\"btnGuardar\">Guardar marca<\u002Fbutton>\n      <button id=\"btnCancelar\">Cancelar<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"lista\"><\u002Fdiv>\n  <div id=\"listaVerMas\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n\u002F\u002F =========================================================\n\u002F\u002F Google Drive \u002F Sheets \u2014 repositorio compartido en vivo\n\u002F\u002F (mismo Client ID y carpeta compartida que Ceneca Workspace)\n\u002F\u002F =========================================================\nconst GCONFIG = {\n  CLIENT_ID: '1030850512230-cgirgoosvop7kfha1qnnb888vb23usff.apps.googleusercontent.com',\n  SCOPES: 'https:\u002F\u002Fwww.googleapis.com\u002Fauth\u002Fdrive',\n  SHARED_FOLDER_ID: '1-f3lEGm8SlaIsmt6MB7LSH5RMKUlaklb',\n  SHEET_NAME: 'Control de Marcas \u00b7 Ceneca',\n  TAB_NAME: 'Marcas',\n};\n\nconst GAuth = (() => {\n  let _user=null,_token=null,_renovando=false;\n  function _tokenVigente(){ const exp=parseInt(localStorage.getItem('marcas_token_exp')||'0'); return exp>Date.now()+30000; }\n  function signIn(){\n    const su=localStorage.getItem('marcas_user'),st=localStorage.getItem('marcas_token');\n    if(su&&st&&_tokenVigente()){ _user=JSON.parse(su); _token=st; onSignedIn(); return; }\n    if(su&&st){\n      _user=JSON.parse(su);\n      renovarSilencioso().then(ok=>{ if(ok) onSignedIn(); else _login('select_account'); });\n      return;\n    }\n    _login('select_account');\n  }\n  function _login(prompt){\n    const scopes=encodeURIComponent(GCONFIG.SCOPES);\n    const clientId=encodeURIComponent(GCONFIG.CLIENT_ID);\n    const redirect=encodeURIComponent(window.location.origin+window.location.pathname);\n    const loginHint=_user?.email?`&login_hint=${encodeURIComponent(_user.email)}`:'';\n    const url=`https:\u002F\u002Faccounts.google.com\u002Fo\u002Foauth2\u002Fv2\u002Fauth?client_id=${clientId}&redirect_uri=${redirect}&response_type=token&scope=${scopes}&prompt=${prompt}${loginHint}`;\n    const popup=window.open(url,'googlelogin','width=500,height=600,left=400,top=100');\n    if(!popup){ document.getElementById('gAuthMsg').textContent='El navegador bloque\u00f3 la ventana emergente. Permite pop-ups para este sitio.'; return; }\n    const timer=setInterval(()=>{\n      try{\n        if(popup.closed){ clearInterval(timer); return; }\n        const hash=popup.location.hash;\n        if(hash&&hash.includes('access_token')){\n          clearInterval(timer);\n          _guardarToken(hash);\n          popup.close();\n          fetch('https:\u002F\u002Fwww.googleapis.com\u002Foauth2\u002Fv3\u002Fuserinfo',{headers:{Authorization:'Bearer '+_token}})\n            .then(r=>r.json()).then(info=>{\n              _user={name:info.name,email:info.email,picture:info.picture,id:info.sub};\n              localStorage.setItem('marcas_user',JSON.stringify(_user));\n              onSignedIn();\n            });\n        }\n      }catch(e){ \u002F* cross-origin mientras Google navega, esperar *\u002F }\n    },500);\n  }\n  function renovarSilencioso(){\n    if(_renovando) return Promise.resolve(false);\n    _renovando=true;\n    return new Promise(resolve=>{\n      const scopes=encodeURIComponent(GCONFIG.SCOPES);\n      const clientId=encodeURIComponent(GCONFIG.CLIENT_ID);\n      const redirect=encodeURIComponent(window.location.origin+window.location.pathname);\n      const loginHint=_user?.email?`&login_hint=${encodeURIComponent(_user.email)}`:'';\n      const url=`https:\u002F\u002Faccounts.google.com\u002Fo\u002Foauth2\u002Fv2\u002Fauth?client_id=${clientId}&redirect_uri=${redirect}&response_type=token&scope=${scopes}&prompt=none${loginHint}`;\n      const ifr=document.createElement('iframe');\n      ifr.style.display='none'; ifr.src=url;\n      let listo=false;\n      const limpiar=ok=>{ if(listo)return; listo=true; _renovando=false; clearTimeout(to); try{ifr.remove();}catch(e){} resolve(ok); };\n      const to=setTimeout(()=>limpiar(false),8000);\n      ifr.onload=()=>{\n        try{\n          const hash=ifr.contentWindow.location.hash;\n          if(hash&&hash.includes('access_token')){ _guardarToken(hash); limpiar(true); }\n          else limpiar(false);\n        }catch(e){ limpiar(false); }\n      };\n      document.body.appendChild(ifr);\n    });\n  }\n  function _guardarToken(hash){\n    const params=new URLSearchParams(hash.substring(1));\n    _token=params.get('access_token');\n    const expIn=parseInt(params.get('expires_in')||'3600');\n    localStorage.setItem('marcas_token',_token);\n    localStorage.setItem('marcas_token_exp',String(Date.now()+expIn*1000));\n  }\n  async function manejarTokenExpirado(){\n    const ok=await renovarSilencioso();\n    if(!ok){ document.getElementById('gSyncStatus').textContent='Sesi\u00f3n expirada \u2014 reconecta con Google'; }\n    return ok;\n  }\n  function getUser(){ return _user||JSON.parse(localStorage.getItem('marcas_user')||'null'); }\n  function getToken(){ return _token||localStorage.getItem('marcas_token'); }\n  async function onSignedIn(){\n    document.getElementById('gAuthGate').style.display='none';\n    document.getElementById('gSyncStatus').textContent='Conectando con Sheets\u2026';\n    try{\n      await GSheets.init();\n      document.getElementById('gSyncStatus').textContent='';\n      const link=document.getElementById('gOpenSheet');\n      link.href=`https:\u002F\u002Fdocs.google.com\u002Fspreadsheets\u002Fd\u002F${GSheets.getId()}\u002Fedit`;\n      link.style.display='inline';\n      const cargadas=await GSheets.loadMarcas();\n      marcas = migrar((cargadas && cargadas.length) ? cargadas : SEMILLA);\n      if(!cargadas || !cargadas.length) await persistir();\n      render();\n    }catch(e){\n      console.error(e);\n      document.getElementById('gSyncStatus').textContent='No se pudo conectar con el Google Sheet compartido.';\n    }\n  }\n  return{signIn,getUser,getToken,manejarTokenExpirado,onSignedIn};\n})();\n\nconst GSheets = (() => {\n  const DRIVE='https:\u002F\u002Fwww.googleapis.com\u002Fdrive\u002Fv3';\n  const SHEETS='https:\u002F\u002Fsheets.googleapis.com\u002Fv4\u002Fspreadsheets';\n  const SHARED='supportsAllDrives=true&includeItemsFromAllDrives=true';\n  let _id=null,_tab=null;\n  function _h(){ return {Authorization:`Bearer ${GAuth.getToken()}`,'Content-Type':'application\u002Fjson'}; }\n  async function _r(url,o={},reintento=false){\n    const res=await fetch(url,{headers:_h(),...o});\n    if(res.status===401&&!reintento){ const ok=await GAuth.manejarTokenExpirado(); if(ok) return _r(url,o,true); }\n    if(!res.ok) throw new Error('Sheets\u002FDrive '+res.status+' '+await res.text());\n    return res.json();\n  }\n  async function init(){\n    const q=`name='${GCONFIG.SHEET_NAME.replace(\u002F'\u002Fg,\"\\\\'\")}' and mimeType='application\u002Fvnd.google-apps.spreadsheet' and '${GCONFIG.SHARED_FOLDER_ID}' in parents and trashed=false`;\n    const r=await _r(`${DRIVE}\u002Ffiles?q=${encodeURIComponent(q)}&fields=files(id,name)&${SHARED}`);\n    if(r.files.length){ _id=r.files[0].id; }\n    else{\n      \u002F\u002F no existe: crear el spreadsheet directo dentro de la carpeta compartida\n      const created=await _r(`${DRIVE}\u002Ffiles?${SHARED}`,{method:'POST',body:JSON.stringify({\n        name:GCONFIG.SHEET_NAME, mimeType:'application\u002Fvnd.google-apps.spreadsheet', parents:[GCONFIG.SHARED_FOLDER_ID]\n      })});\n      _id=created.id;\n    }\n    \u002F\u002F Siempre resolvemos el nombre REAL de la primera pesta\u00f1a (puede venir en cualquier\n    \u002F\u002F idioma \u2014 \"Sheet1\"\u002F\"Hoja 1\" \u2014 o de un intento previo que se haya quedado a medias).\n    const meta=await _r(`${SHEETS}\u002F${_id}?fields=sheets.properties`);\n    const sheetId=meta.sheets[0].properties.sheetId;\n    _tab=meta.sheets[0].properties.title;\n    if(_tab!==GCONFIG.TAB_NAME){\n      try{\n        await _r(`${SHEETS}\u002F${_id}:batchUpdate`,{method:'POST',body:JSON.stringify({\n          requests:[{updateSheetProperties:{properties:{sheetId,title:GCONFIG.TAB_NAME},fields:'title'}}]\n        })});\n        _tab=GCONFIG.TAB_NAME;\n      }catch(e){ \u002F* si no se puede renombrar, seguimos usando el nombre real *\u002F }\n    }\n    \u002F\u002F Si la fila de encabezados est\u00e1 vac\u00eda (hoja nueva o creaci\u00f3n previa incompleta), la escribimos.\n    const first=await _r(`${SHEETS}\u002F${_id}\u002Fvalues\u002F${encodeURIComponent(_tab+'!A1:A1')}`).catch(()=>({}));\n    if(!first.values || !first.values.length){\n      await _r(`${SHEETS}\u002F${_id}\u002Fvalues\u002F${encodeURIComponent(_tab+'!A1')}?valueInputOption=RAW`,{\n        method:'PUT', body:JSON.stringify({values:[EXCEL_HEADERS]})\n      });\n    }\n  }\n  function getId(){ return _id; }\n  async function loadMarcas(){\n    const range=encodeURIComponent(_tab+'!A1:T5000');\n    const r=await _r(`${SHEETS}\u002F${_id}\u002Fvalues\u002F${range}`);\n    const rows=r.values||[];\n    if(rows.length<2) return [];\n    const headers=rows[0];\n    return rows.slice(1).filter(row=>row.some(v=>v)).map((row,i)=>{\n      const obj={}; headers.forEach((h,idx)=>obj[h]=row[idx]??'');\n      return filaAMarca(obj,i);\n    });\n  }\n  async function saveMarcas(marcasArr){\n    const aoa=[EXCEL_HEADERS, ...marcasArr.map(marcaAFilas)];\n    \u002F\u002F limpiar todo el rango primero para no dejar filas viejas colgando\n    await _r(`${SHEETS}\u002F${_id}\u002Fvalues\u002F${encodeURIComponent(_tab+'!A1:T5000')}:clear`,{method:'POST',body:'{}'});\n    await _r(`${SHEETS}\u002F${_id}\u002Fvalues\u002F${encodeURIComponent(_tab+'!A1')}?valueInputOption=USER_ENTERED`,{\n      method:'PUT', body:JSON.stringify({values:aoa})\n    });\n  }\n  return{init,getId,loadMarcas,saveMarcas};\n})();\n\nconst KEY = 'marcas_v1';\nconst TIPOS_OFICIO = ['Requisito de forma','Anterioridad','Impedimento','Oposici\u00f3n','Otro'];\nconst TIPOS_SIGNO = ['Marca','Aviso comercial','Nombre comercial'];\nconst PALETA = ['#3b6ea5','#a5573b','#5a8f5a','#8f5a8f','#c9a227','#3b9a94','#a53b6e','#6e8f3b','#5a5a8f','#a5735a','#3b8fa5','#8f7a3b'];\nlet marcas = [];\nlet editId = null;\nlet calDate = new Date(); calDate.setDate(1);\n\n\u002F\u002F ---------- fechas ----------\nconst MS = 86400000;\nfunction addMonths(iso, n){\n  const d = new Date(iso+'T00:00:00');\n  const day = d.getDate();\n  d.setMonth(d.getMonth()+n);\n  if(d.getDate()<day) d.setDate(0);\n  return d;\n}\nconst MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\nfunction fmt(d){\n  \u002F\u002F Orden fijo d\u00eda \u00b7 mes \u00b7 a\u00f1o (no depende de configuraci\u00f3n regional del navegador).\n  const dd = String(d.getDate()).padStart(2,'0');\n  return `${dd} ${MESES_CORTOS[d.getMonth()]} ${d.getFullYear()}`;\n}\nfunction diasDesdeHoy(d){\n  const hoy = new Date(); hoy.setHours(0,0,0,0);\n  return Math.round((d - hoy)\u002FMS);\n}\nfunction hoyISO(){\n  const d = new Date(), z = n => String(n).padStart(2,'0');\n  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;\n}\nfunction isoOf(d){ const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }\nfunction cuentaAccion(dias){\n  if(dias<0) return `vencido hace ${Math.abs(dias)} d`;\n  if(dias===0) return 'vence hoy';\n  return `en ${dias} d`;\n}\nfunction cuentaHito(dias){\n  if(dias<0) return `hace ${Math.abs(dias)} d`;\n  if(dias===0) return 'hoy';\n  return `en ${dias} d`;\n}\nfunction cuentaDe(p){\n  if(p.tipo==='hecho') return '\u2713 hecho';\n  if(p.tipo==='espera') return 'sin plazo \u2014 en espera';\n  if(p.tipo==='accion') return cuentaAccion(p.dias);\n  return cuentaHito(p.dias);\n}\nfunction norm(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(\u002F[\\u0300-\\u036f]\u002Fg,''); }\nfunction colorMarca(id){\n  let h = 0; for(const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0;\n  return PALETA[h % PALETA.length];\n}\nfunction inicialesDe(signo){\n  const palabras = String(signo||'').trim().split(\u002F\\s+\u002F).filter(Boolean);\n  if(!palabras.length) return '\u00b7';\n  if(palabras.length===1) return palabras[0].slice(0,2).toUpperCase();\n  return (palabras[0][0]+palabras[1][0]).toUpperCase();\n}\n\n\u002F\u002F ---------- motor de plazos (LFPPI) ----------\nfunction plazosDe(m){\n  const P = [];\n  const esNombreCom = m.tipo === 'Nombre comercial';\n  const txtSolicitud = esNombreCom ? 'Solicitud de publicaci\u00f3n presentada' : 'Solicitud presentada';\n  const txtConcesion = esNombreCom ? 'Otorgamiento de la publicaci\u00f3n' : 'Concesi\u00f3n del registro';\n\n  if(m.solicitud){\n    P.push({nombre:txtSolicitud, fecha:new Date(m.solicitud+'T00:00:00'), tipo:'hito', fund:''});\n  }\n  const oficios = Array.isArray(m.oficios) ? m.oficios : [];\n  const hayOficio = oficios.some(o=>o.fecha);\n  if(m.estatus==='En tr\u00e1mite'){\n    oficios.forEach(o=>{\n      if(!o.fecha) return;\n      const t = o.tipo ? ' \u00b7 '+o.tipo : '';\n      if(o.contestado){\n        const f = o.resp || o.fecha;\n        P.push({nombre:'Oficio contestado'+t, fecha:new Date(f+'T00:00:00'),\n                tipo:'hecho', fund:'Contestaci\u00f3n presentada'});\n      } else {\n        P.push({nombre:'Contestar oficio'+t+' \u2014 plazo base', fecha:addMonths(o.fecha,2),\n                tipo:'accion', hard:false, fund:'Art. 225 \u00b7 2 meses, sin pr\u00f3rroga'});\n        P.push({nombre:'Contestar oficio'+t+' \u2014 l\u00edmite final', fecha:addMonths(o.fecha,4),\n                tipo:'accion', hard:true, fund:'Art. 226 \u00b7 +2 meses con pago \u00b7 vencer = abandono'});\n      }\n    });\n    const ultimoOficio = oficios.length ? oficios[oficios.length-1] : null;\n    if(!m.otorg && ultimoOficio && ultimoOficio.contestado){\n      const f = ultimoOficio.resp || ultimoOficio.fecha;\n      const tRef = ultimoOficio.tipo ? ' \u00b7 tras responder ' + ultimoOficio.tipo.toLowerCase() : '';\n      P.push({nombre:'En espera de resoluci\u00f3n del IMPI'+tRef, fecha:new Date(f+'T00:00:00'),\n              tipo:'espera', fund:'Art. 230 \u00b7 sin plazo perentorio para que el IMPI resuelva'});\n    }\n  }\n  if(m.otorg){\n    P.push({nombre:txtConcesion, fecha:new Date(m.otorg+'T00:00:00'),\n            tipo:'hito', fund:'Ancla de los plazos de vida'});\n    const aplicaDU = new Date(m.otorg) >= new Date('2018-08-10');\n    if(aplicaDU){\n      if(m.du){\n        const f = m.duFecha || m.otorg;\n        P.push({nombre:'Declaraci\u00f3n de uso presentada', fecha:new Date(f+'T00:00:00'),\n                tipo:'hecho', fund:'Art. 233 \u00b7 cumplida'});\n      } else {\n        P.push({nombre:'Declaraci\u00f3n de uso', fecha:addMonths(m.otorg,39),\n                tipo:'accion', hard:true, fund:'Art. 233 \u00b7 3er aniversario + 3 meses (evento \u00fanico)'});\n      }\n    }\n    const renovaciones = (Array.isArray(m.renovaciones) ? m.renovaciones : []).filter(r=>r.fecha);\n    renovaciones.forEach((r,i)=>{\n      P.push({nombre:`Renovaci\u00f3n presentada (ciclo ${i+1} \u2192 ${i+2})`, fecha:new Date(r.fecha+'T00:00:00'),\n              tipo:'hecho', fund:'Art. 237 \u00b7 registrada \u2014 incluye declaraci\u00f3n de uso real y efectivo'});\n    });\n    const nRenov = renovaciones.length;\n    const cicloTxt = nRenov ? ` (ciclo ${nRenov+1})` : '';\n    const finCiclo = addMonths(m.otorg, 120*(nRenov+1));\n    const ventanaInicio = addMonths(m.otorg, 120*(nRenov+1)-6);\n    const ventanaFin = addMonths(m.otorg, 120*(nRenov+1)+6);\n    P.push({nombre:'Ventana de renovaci\u00f3n \u2014 abre'+cicloTxt, fecha:ventanaInicio,\n            tipo:'info', fund:'Art. 237 \u00b7 6 meses antes del vencimiento'});\n    P.push({nombre:'Renovaci\u00f3n'+cicloTxt+' \u2014 antes del vencimiento', fecha:finCiclo,\n            tipo:'accion', hard:false,\n            fund:(nRenov?'+10 a\u00f1os desde la renovaci\u00f3n anterior':'10 a\u00f1os desde el otorgamiento')\n              +' \u00b7 Art. 237 primer p\u00e1rrafo \u00b7 v\u00eda normal, declarando uso al presentarla'});\n    P.push({nombre:'Renovaci\u00f3n'+cicloTxt+' \u2014 l\u00edmite con posterioridad a la vigencia', fecha:ventanaFin,\n            tipo:'accion', hard:true,\n            fund:'Art. 237 segundo p\u00e1rrafo \u00b7 6 meses despu\u00e9s del vencimiento \u00b7 vencer = caducidad de pleno derecho'});\n  } else if(m.solicitud && m.estatus==='En tr\u00e1mite' && !hayOficio){\n    P.push({nombre:'IMPI debe resolver', fecha:addMonths(m.solicitud,5),\n            tipo:'info', fund:'Art. 229 Bis \u00b7 \u22645 meses (informativo)'});\n  }\n  P.forEach(p=>p.dias=diasDesdeHoy(p.fecha));\n  P.sort((a,b)=>a.fecha-b.fecha);\n  return P;\n}\nfunction semaforoDe(m, plazos){\n  if(m.estatus==='Rechazada') return {clase:'negro', txt:'Rechazada'};\n  const acc = plazos.filter(p=>p.tipo==='accion');\n  if(acc.length===0) return {clase:'gris', txt:'En tr\u00e1mite'};\n  const min = Math.min(...acc.map(p=>p.dias));\n  const duroVencido = acc.some(p=>p.hard && p.dias<0);\n  if(duroVencido) return {clase:'rojo', txt:'Vencido'};\n  if(min<0 || min<=30) return {clase:'rojo', txt:'Urgente'};\n  if(min<=90) return {clase:'ambar', txt:'Pr\u00f3ximo'};\n  return {clase:'verde', txt:'En regla'};\n}\nfunction colorDias(p){\n  if(p.tipo==='hecho') return 'verde';\n  if(p.tipo==='espera') return 'gris';\n  if(p.tipo==='info') return 'gris';\n  if(p.tipo!=='accion') return 'gris';\n  if(p.dias<0) return p.hard ? 'rojo' : 'ambar';\n  if(p.dias<=30) return 'rojo';\n  if(p.dias<=90) return 'ambar';\n  return 'verde';\n}\n\n\u002F\u002F ---------- persistencia (Google Sheet compartido) ----------\nasync function persistir(){\n  document.getElementById('gSyncStatus').textContent='Guardando\u2026';\n  try{\n    await GSheets.saveMarcas(marcas);\n    document.getElementById('gSyncStatus').textContent='';\n  }catch(e){\n    console.error('No se pudo guardar en Sheets', e);\n    document.getElementById('gSyncStatus').textContent='No se pudo guardar \u2014 revisa tu conexi\u00f3n.';\n  }\n}\nfunction migrar(arr){\n  return (arr||[]).map(m=>{\n    if(!Array.isArray(m.oficios)){\n      m.oficios = m.oficio\n        ? [{fecha:m.oficio, tipo:m.oficioTipo||'Anterioridad', contestado:!!m.oficioContestado, resp:m.oficioResp||''}]\n        : [];\n    }\n    if(!Array.isArray(m.renovaciones)) m.renovaciones = [];\n    if(!m.tipo) m.tipo = 'Marca';\n    if(m.subtipo===undefined) m.subtipo = '';\n    if(m.fechaRechazo===undefined) m.fechaRechazo = '';\n    if(m.expediente===undefined) m.expediente = '';\n    if(m.registro===undefined) m.registro = '';\n    return m;\n  });\n}\n\n\u002F\u002F ---------- calendario ----------\nfunction mesNombre(d){ return d.toLocaleDateString('es-MX',{month:'long', year:'numeric'}); }\nfunction eventosDelMes(year, month){\n  const map = {};\n  marcas.forEach(m=>{\n    plazosDe(m).forEach(p=>{\n      if(p.tipo==='accion' || p.tipo==='hito'){\n        const f = p.fecha;\n        if(f.getFullYear()===year && f.getMonth()===month){\n          const key = isoOf(f);\n          (map[key] = map[key]||[]).push({marcaId:m.id, marca:m.signo, nombre:p.nombre, color:colorDias(p)});\n        }\n      }\n    });\n  });\n  return map;\n}\nfunction renderLeyendaMarcas(map){\n  const box = document.getElementById('calLegendList');\n  const keys = Object.keys(map).sort();\n  if(!keys.length){ box.innerHTML = '<div class=\"cal-hint\">Sin plazos este mes.<\u002Fdiv>'; return; }\n  let html = '';\n  keys.forEach(key=>{\n    const d = new Date(key+'T00:00:00');\n    const diaTxt = d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});\n    map[key].forEach(e=>{\n      const sev = e.color==='rojo' ? ' warn' : (e.color==='ambar' ? ' soon' : '');\n      html += `<div class=\"cal-legend-item\">\n        <span class=\"cal-legend-sw${sev}\" style=\"background:${colorMarca(e.marcaId)}\"><\u002Fspan>\n        <span class=\"txt\"><b>${esc(e.marca)}<\u002Fb> | ${esc(e.nombre)}<span class=\"fecha-mini\">${diaTxt}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>`;\n    });\n  });\n  box.innerHTML = html;\n}\nfunction renderResumen(){\n  const conSem = marcas.map(m=>semaforoDe(m, plazosDe(m)));\n  const contarTxt = t => conSem.filter(s=>s.txt===t).length;\n  const filas = [\n    {txt:'Vencido', clase:'rojo'},\n    {txt:'Urgente', clase:'rojo'},\n    {txt:'Pr\u00f3ximo', clase:'ambar'},\n    {txt:'En regla', clase:'verde'},\n  ];\n  document.getElementById('calResumen').innerHTML = filas.map(f=>`\n    <div class=\"cal-resumen-row\"><span class=\"dot d-${f.clase}\"><\u002Fspan>${f.txt}<span class=\"num\">${contarTxt(f.txt)}<\u002Fspan><\u002Fdiv>\n  `).join('');\n}\nfunction renderCalendario(){\n  const year = calDate.getFullYear(), month = calDate.getMonth();\n  document.getElementById('calMes').textContent = mesNombre(calDate);\n  document.getElementById('calPicker').value = `${year}-${String(month+1).padStart(2,'0')}`;\n  const map = eventosDelMes(year, month);\n  const startOffset = new Date(year, month, 1).getDay();\n  const diasEnMes = new Date(year, month+1, 0).getDate();\n  const hoy = hoyISO();\n  let html = ['Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b'].map(d=>`<div class=\"cal-dow\">${d}<\u002Fdiv>`).join('');\n  for(let i=0;i<startOffset;i++) html += `<div class=\"cal-cell cal-empty\"><\u002Fdiv>`;\n  for(let day=1; day<=diasEnMes; day++){\n    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;\n    const evs = map[key]||[];\n    const uniqMarcas = [...new Map(evs.map(e=>[e.marcaId,e])).values()];\n    const visibles = uniqMarcas.slice(0,3);\n    const dots = visibles.map(e=>{\n      const sev = e.color==='rojo' ? ' warn' : (e.color==='ambar' ? ' soon' : '');\n      return `<span class=\"cal-mdot${sev}\" style=\"background:${colorMarca(e.marcaId)}\"><\u002Fspan>`;\n    }).join('');\n    const extra = uniqMarcas.length>3 ? `<span class=\"cal-more\">+${uniqMarcas.length-3}<\u002Fspan>` : '';\n    html += `<div class=\"cal-cell${key===hoy?' cal-hoy':''}${evs.length?' cal-has':''}\" data-key=\"${key}\">\n      <span class=\"cal-num\">${day}<\u002Fspan>\n      ${evs.length?`<span class=\"cal-dots\">${dots}${extra}<\u002Fspan>`:''}\n    <\u002Fdiv>`;\n  }\n  document.getElementById('calGrid').innerHTML = html;\n  document.querySelectorAll('.cal-cell.cal-has').forEach(c=>{\n    c.onclick = ()=> mostrarDiaCal(c.dataset.key, map[c.dataset.key]);\n  });\n  const det = document.getElementById('calDetalle');\n  if(map[hoy] && map[hoy].length) mostrarDiaCal(hoy, map[hoy]);\n  else det.innerHTML = '<div class=\"cal-hint\">Toca un d\u00eda marcado para ver el detalle.<\u002Fdiv>';\n  renderLeyendaMarcas(map);\n  renderResumen();\n}\nfunction mostrarDiaCal(key, evs){\n  const det = document.getElementById('calDetalle');\n  const f = new Date(key+'T00:00:00');\n  det.innerHTML = `<div class=\"cal-detalle-fecha\">${fmt(f)}<\u002Fdiv>` + evs.map(e=>`\n    <div class=\"cal-detalle-item\"><span class=\"cal-mdot\" style=\"background:${colorMarca(e.marcaId)}\"><\u002Fspan><b>${esc(e.marca)}<\u002Fb> \u2014 ${esc(e.nombre)}<\u002Fdiv>`).join('');\n}\n\n\u002F\u002F ---------- historial completo (independiente del estatus) ----------\nfunction historialDe(m){\n  const H = [];\n  const esNombreCom = m.tipo === 'Nombre comercial';\n  if(m.solicitud) H.push({fecha:m.solicitud, texto: esNombreCom ? 'Solicitud de publicaci\u00f3n presentada' : 'Solicitud presentada'});\n  (Array.isArray(m.oficios) ? m.oficios : []).forEach(o=>{\n    if(o.fecha) H.push({fecha:o.fecha, texto:`Oficio recibido \u002F notificado${o.tipo?' \u00b7 '+o.tipo:''}`});\n    if(o.contestado && o.resp) H.push({fecha:o.resp, texto:`Oficio contestado${o.tipo?' \u00b7 '+o.tipo:''}`});\n  });\n  if(m.otorg) H.push({fecha:m.otorg, texto: esNombreCom ? 'Publicaci\u00f3n otorgada' : 'Registro concedido'});\n  if(m.du && m.duFecha) H.push({fecha:m.duFecha, texto:'Declaraci\u00f3n de uso presentada'});\n  (Array.isArray(m.renovaciones) ? m.renovaciones : []).filter(r=>r.fecha).forEach((r,i)=>{\n    H.push({fecha:r.fecha, texto:`Renovaci\u00f3n ${i+1} presentada`});\n  });\n  if(m.estatus==='Rechazada' && m.fechaRechazo) H.push({fecha:m.fechaRechazo, texto:'Solicitud rechazada'});\n  H.sort((a,b)=>a.fecha.localeCompare(b.fecha));\n  return H;\n}\n\n\u002F\u002F ---------- filtro por gravedad \u002F estatus ----------\nlet filtroActual = 'Todas';\nlet busqueda = '';\nlet visibleCount = 12;\nconst CATS_FILTRO = ['Todas','Vencido','Urgente','Pr\u00f3ximo','En regla','En tr\u00e1mite','Rechazada'];\nfunction renderFiltros(conSem){\n  const box = document.getElementById('filtros');\n  const contar = t => t==='Todas' ? marcas.length : conSem.filter(s=>s.txt===t).length;\n  box.innerHTML = CATS_FILTRO.map(c=>\n    `<button type=\"button\" class=\"chip${filtroActual===c?' active':''}\" data-cat=\"${c}\">${c}<span class=\"n\">${contar(c)}<\u002Fspan><\u002Fbutton>`\n  ).join('');\n  box.querySelectorAll('.chip').forEach(b=>{\n    b.onclick = ()=>{ filtroActual = b.dataset.cat; visibleCount = 12; render(); };\n  });\n}\n\n\u002F\u002F ---------- render ----------\nfunction render(){\n  const conSem = marcas.map(m=>({m, sem:semaforoDe(m, plazosDe(m))}));\n  document.getElementById('stats').innerHTML = `\n    <div class=\"stat\"><div class=\"n\">${marcas.length}<\u002Fdiv><div class=\"l\">Marcas totales<\u002Fdiv><\u002Fdiv>`;\n\n  renderCalendario();\n  renderFiltros(conSem.map(x=>x.sem));\n\n  const lista = document.getElementById('lista');\n  const masBox = document.getElementById('listaVerMas');\n  if(marcas.length===0){\n    lista.className = ''; masBox.innerHTML = '';\n    lista.innerHTML = `<div class=\"empty\">A\u00fan no hay marcas. Da clic en \u201cAgregar marca\u201d para empezar.<\u002Fdiv>`;\n    return;\n  }\n\n  let filtradas = filtroActual==='Todas' ? conSem : conSem.filter(x=>x.sem.txt===filtroActual);\n  if(busqueda){\n    filtradas = filtradas.filter(x=> norm(x.m.signo).includes(busqueda) || norm(x.m.titular).includes(busqueda));\n  }\n  filtradas = filtradas.slice().sort((a,b)=> norm(a.m.signo).localeCompare(norm(b.m.signo),'es'));\n\n  if(filtradas.length===0){\n    lista.className = ''; masBox.innerHTML = '';\n    lista.innerHTML = `<div class=\"empty\">No hay marcas que coincidan con el filtro o la b\u00fasqueda.<\u002Fdiv>`;\n    return;\n  }\n\n  const visibles = filtradas.slice(0, visibleCount);\n  lista.className = 'lista-grid';\n  lista.innerHTML = visibles.map(({m, sem})=>{\n    const P = plazosDe(m);\n    const filas = P.map(p=>`\n      <div class=\"plazo${p.tipo==='hecho'?' done':''}\">\n        <span class=\"dot d-${colorDias(p)}\"><\u002Fspan>\n        <span class=\"nombre\">${esc(p.nombre)}${p.fund?` <span class=\"fund\">\u00b7 ${esc(p.fund)}<\u002Fspan>`:''}<\u002Fspan>\n        <span class=\"fecha\">${fmt(p.fecha)}<\u002Fspan>\n        <span class=\"cuenta\">${cuentaDe(p)}<\u002Fspan>\n      <\u002Fdiv>`).join('');\n    const H = historialDe(m);\n    const historialHtml = H.length ? `<details class=\"historial\"><summary>Historial (${H.length})<\u002Fsummary>${\n      H.map(h=>`<div class=\"hist-item\"><span class=\"hist-fecha\">${fmt(new Date(h.fecha+'T00:00:00'))}<\u002Fspan><span class=\"hist-texto\">${esc(h.texto)}<\u002Fspan><\u002Fdiv>`).join('')\n    }<\u002Fdetails>` : '';\n    const meta = [m.tipo!=='Marca'?m.tipo:'', m.subtipo||'', m.titular, m.clase?('Clase '+m.clase):'', m.estatus].filter(Boolean).join(' \u00b7 ');\n    return `<div class=\"card\">\n      <div class=\"top\">\n        <div><div class=\"signo\"><span class=\"avatar\" style=\"background:${colorMarca(m.id)}\">${esc(inicialesDe(m.signo))}<\u002Fspan>${esc(m.signo)}<\u002Fdiv><div class=\"meta\">${esc(meta)}<\u002Fdiv><\u002Fdiv>\n        <span class=\"badge b-${sem.clase}\">${sem.txt}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"plazos\">${filas || '<div class=\"plazo\"><span class=\"nombre\" style=\"color:var(--muted)\">Sin plazos a\u00fan \u2014 captura la fecha de otorgamiento.<\u002Fspan><\u002Fdiv>'}<\u002Fdiv>\n      ${historialHtml}\n      <div class=\"acciones\">\n        <button onclick=\"editar('${m.id}')\">Editar<\u002Fbutton>\n        <button onclick=\"borrar('${m.id}')\">Eliminar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  if(filtradas.length > visibleCount){\n    masBox.innerHTML = `<div class=\"ver-mas-wrap\"><button id=\"btnVerMas\">+ Ver m\u00e1s (${filtradas.length - visibleCount})<\u002Fbutton><\u002Fdiv>`;\n    document.getElementById('btnVerMas').onclick = ()=>{ visibleCount += 12; render(); };\n  } else {\n    masBox.innerHTML = '';\n  }\n}\nfunction esc(s){ return String(s??'').replace(\u002F[&<>\"]\u002Fg,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n\n\u002F\u002F ---------- oficios (lista repetible en el form) ----------\nfunction leerOficiosDOM(){\n  return [...document.querySelectorAll('#oficios_box .rep-row')].map(r=>({\n    tipo: r.querySelector('.of-tipo').value,\n    fecha: r.querySelector('.of-fecha').value,\n    contestado: r.querySelector('.of-cont').checked,\n    resp: r.querySelector('.of-resp').value,\n  }));\n}\nfunction renderOficios(arr){\n  const box = document.getElementById('oficios_box');\n  if(!arr.length){\n    box.innerHTML = '<div class=\"rep-empty\">Sin oficios. Agrega uno cuando el IMPI emita un requerimiento de forma, anterioridad, impedimento u oposici\u00f3n.<\u002Fdiv>';\n    return;\n  }\n  box.innerHTML = arr.map(o=>`\n    <div class=\"rep-row\">\n      <div class=\"rowtop\">\n        <select class=\"of-tipo\">${TIPOS_OFICIO.map(t=>`<option${o.tipo===t?' selected':''}>${t}<\u002Foption>`).join('')}<\u002Fselect>\n        <button type=\"button\" class=\"rm\">Quitar<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Fecha de oficio (notificaci\u00f3n)<\u002Flabel><input type=\"date\" class=\"of-fecha\" value=\"${o.fecha||''}\"><\u002Fdiv>\n      <div class=\"field\"><label>Fecha de contestaci\u00f3n<\u002Flabel><input type=\"date\" class=\"of-resp\" value=\"${o.resp||''}\"><\u002Fdiv>\n      <div class=\"field check full\"><input type=\"checkbox\" class=\"of-cont\"${o.contestado?' checked':''}><label style=\"color:var(--ink)\">Contestado<\u002Flabel><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  box.querySelectorAll('.rep-row').forEach((row,i)=>{\n    row.querySelector('.rm').onclick = ()=>{ const a=leerOficiosDOM(); a.splice(i,1); renderOficios(a); };\n    const cont = row.querySelector('.of-cont'), resp = row.querySelector('.of-resp');\n    cont.addEventListener('change', ()=>{ if(cont.checked && !resp.value) resp.value = hoyISO(); });\n  });\n}\n\n\u002F\u002F ---------- renovaciones (lista repetible en el form) ----------\nfunction leerRenovacionesDOM(){\n  return [...document.querySelectorAll('#renov_box .rep-row')].map(r=>({\n    fecha: r.querySelector('.rv-fecha').value,\n  }));\n}\nfunction renderRenovaciones(arr){\n  const box = document.getElementById('renov_box');\n  if(!arr.length){\n    box.innerHTML = '<div class=\"rep-empty\">Sin renovaciones registradas. Agrega una cuando presentes la renovaci\u00f3n (dentro de los 6 meses antes o despu\u00e9s del vencimiento).<\u002Fdiv>';\n    return;\n  }\n  box.innerHTML = arr.map((r,i)=>`\n    <div class=\"rep-row\">\n      <div class=\"rowtop\">\n        <span style=\"font-size:12.5px;color:var(--muted)\">Renovaci\u00f3n ${i+1}<\u002Fspan>\n        <button type=\"button\" class=\"rm\">Quitar<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"field full\"><label>Fecha de presentaci\u00f3n<\u002Flabel><input type=\"date\" class=\"rv-fecha\" value=\"${r.fecha||''}\"><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  box.querySelectorAll('.rep-row').forEach((row,i)=>{\n    row.querySelector('.rm').onclick = ()=>{ const a=leerRenovacionesDOM(); a.splice(i,1); renderRenovaciones(a); };\n  });\n}\n\n\u002F\u002F ---------- form ----------\nconst form = document.getElementById('form');\nfunction abrirForm(m){\n  editId = m?m.id:null;\n  document.getElementById('avisoIA').innerHTML = '';\n  document.getElementById('f_signo').value = m?m.signo:'';\n  document.getElementById('f_tipo').value = m?(m.tipo||'Marca'):'Marca';\n  document.getElementById('f_subtipo').value = m?(m.subtipo||''):'';\n  document.getElementById('f_titular').value = m?m.titular||'':'';\n  document.getElementById('f_clase').value = m?m.clase||'':'';\n  document.getElementById('f_estatus').value = m?m.estatus:'En tr\u00e1mite';\n  document.getElementById('f_fechaRechazo').value = m?m.fechaRechazo||'':'';\n  document.getElementById('f_exp').value = m?m.expediente||'':'';\n  document.getElementById('f_reg').value = m?m.registro||'':'';\n  document.getElementById('f_solicitud').value = m?m.solicitud||'':'';\n  document.getElementById('f_otorg').value = m?m.otorg||'':'';\n  document.getElementById('f_du').checked = m?!!m.du:false;\n  document.getElementById('f_dufecha').value = m?m.duFecha||'':'';\n  renderOficios(m ? (m.oficios||[]) : []);\n  renderRenovaciones(m ? (m.renovaciones||[]) : []);\n  form.classList.remove('hidden');\n  document.getElementById('f_signo').focus();\n}\nfunction cerrarForm(){ form.classList.add('hidden'); editId=null; }\n\ndocument.getElementById('f_otorg').addEventListener('change', e=>{\n  \u002F\u002F al capturar la fecha de otorgamiento, ya hay concesi\u00f3n: pasa de \"En tr\u00e1mite\" a \"Registrada\"\n  if(e.target.value) document.getElementById('f_estatus').value = 'Registrada';\n});\ndocument.getElementById('f_du').addEventListener('change', e=>{\n  const f = document.getElementById('f_dufecha');\n  if(e.target.checked && !f.value) f.value = hoyISO();\n});\ndocument.getElementById('f_dufecha').addEventListener('input', e=>{\n  \u002F\u002F capturar la fecha de presentaci\u00f3n ya implica que se present\u00f3 \u2014 no hace falta marcar la casilla aparte.\n  if(e.target.value) document.getElementById('f_du').checked = true;\n});\ndocument.getElementById('btnAddOficio').onclick = ()=>{\n  const a = leerOficiosDOM();\n  a.push({tipo:TIPOS_OFICIO[0], fecha:'', contestado:false, resp:''});\n  renderOficios(a);\n};\ndocument.getElementById('btnAddRenov').onclick = ()=>{\n  const a = leerRenovacionesDOM();\n  a.push({fecha:hoyISO()});\n  renderRenovaciones(a);\n};\n\u002F\u002F ---------- validaci\u00f3n legal antes de guardar ----------\n\u002F\u002F Evita capturas imposibles: marcar un hecho antes de que exista el plazo que lo habilita,\n\u002F\u002F o registrar una renovaci\u00f3n cuando la ley dice que el registro ya habr\u00eda caducado.\nfunction validarMarca(datos){\n  const errores = [];\n  const otorg = datos.otorg;\n\n  if(otorg){\n    const aplicaDU = new Date(otorg) >= new Date('2018-08-10');\n    if(aplicaDU && datos.du){\n      const abre = addMonths(otorg,36), cierra = addMonths(otorg,39);\n      const f = datos.duFecha ? new Date(datos.duFecha+'T00:00:00') : null;\n      if(!f){\n        errores.push('Falta la fecha de presentaci\u00f3n de la Declaraci\u00f3n de Uso.');\n      } else if(f < abre){\n        errores.push(`La Declaraci\u00f3n de Uso no puede presentarse antes de ${fmt(abre)} \u2014 es cuando se cumple el 3er aniversario del otorgamiento (Art. 233). Todav\u00eda no es plazo.`);\n      } else if(f > cierra){\n        errores.push(`La fecha de la Declaraci\u00f3n de Uso (${fmt(f)}) es posterior al l\u00edmite del ${fmt(cierra)} (Art. 233). Con esa fecha el registro ya habr\u00eda caducado de pleno derecho, as\u00ed que no pudo presentarse v\u00e1lidamente despu\u00e9s.`);\n      }\n    }\n    if(datos.renovaciones && datos.renovaciones.length){\n      if(aplicaDU && !datos.du){\n        errores.push('No puedes registrar una renovaci\u00f3n sin haber presentado antes la Declaraci\u00f3n de Uso del 3er a\u00f1o: sin ella, el registro caduca de pleno derecho mucho antes de llegar a la renovaci\u00f3n (Art. 233, \u00faltimo p\u00e1rrafo).');\n      } else {\n        datos.renovaciones.forEach((r,i)=>{\n          const abre = addMonths(otorg, 120*(i+1)-6), cierra = addMonths(otorg, 120*(i+1)+6);\n          const f = new Date(r.fecha+'T00:00:00');\n          if(f < abre){\n            errores.push(`La renovaci\u00f3n ${i+1} (${fmt(f)}) es antes de que abra su ventana (${fmt(abre)}, Art. 237). Todav\u00eda no es plazo.`);\n          } else if(f > cierra){\n            errores.push(`La renovaci\u00f3n ${i+1} (${fmt(f)}) es posterior al l\u00edmite de gracia (${fmt(cierra)}, Art. 237). Con esa fecha el registro ya habr\u00eda caducado.`);\n          }\n        });\n      }\n    }\n  } else if(datos.renovaciones && datos.renovaciones.length){\n    errores.push('No puedes registrar una renovaci\u00f3n sin capturar antes la fecha de otorgamiento.');\n  }\n\n  (datos.oficios||[]).forEach((o,i)=>{\n    if(o.contestado && o.fecha && o.resp && new Date(o.resp+'T00:00:00') < new Date(o.fecha+'T00:00:00')){\n      errores.push(`La contestaci\u00f3n del oficio ${i+1} no puede ser anterior a la fecha del propio oficio.`);\n    }\n  });\n\n  return errores;\n}\n\ndocument.getElementById('btnNueva').onclick = ()=>abrirForm(null);\ndocument.getElementById('btnCancelar').onclick = cerrarForm;\ndocument.getElementById('btnGuardar').onclick = async ()=>{\n  const signo = document.getElementById('f_signo').value.trim();\n  if(!signo){ document.getElementById('f_signo').focus(); return; }\n  const du = document.getElementById('f_du').checked;\n  const oficios = leerOficiosDOM()\n    .filter(o=>o.fecha || o.contestado)\n    .map(o=>({...o, resp: o.contestado ? (o.resp||hoyISO()) : o.resp}));\n  const renovaciones = leerRenovacionesDOM().filter(r=>r.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha));\n  const estatus = document.getElementById('f_estatus').value;\n  const datos = {\n    signo,\n    tipo: document.getElementById('f_tipo').value,\n    subtipo: document.getElementById('f_subtipo').value,\n    titular: document.getElementById('f_titular').value.trim(),\n    clase: document.getElementById('f_clase').value.trim(),\n    estatus,\n    fechaRechazo: estatus==='Rechazada' ? (document.getElementById('f_fechaRechazo').value || hoyISO()) : '',\n    expediente: document.getElementById('f_exp').value.trim(),\n    registro: document.getElementById('f_reg').value.trim(),\n    solicitud: document.getElementById('f_solicitud').value,\n    otorg: document.getElementById('f_otorg').value,\n    oficios,\n    du,\n    duFecha: du ? (document.getElementById('f_dufecha').value || hoyISO()) : '',\n    renovaciones,\n  };\n  const errores = validarMarca(datos);\n  if(errores.length){\n    document.getElementById('avisoIA').innerHTML =\n      '<div class=\"aviso-error\"><b>No se guard\u00f3 \u2014 revisa estas fechas:<\u002Fb><ul>' +\n      errores.map(e=>`<li>${esc(e)}<\u002Fli>`).join('') + '<\u002Ful><\u002Fdiv>';\n    return;\n  }\n  if(editId){ const m = marcas.find(x=>x.id===editId); Object.assign(m, datos); }\n  else { datos.id = 'm'+Date.now(); marcas.push(datos); }\n  await persistir(); cerrarForm(); render();\n};\nwindow.editar = id => abrirForm(marcas.find(m=>m.id===id));\nwindow.borrar = async id => { marcas = marcas.filter(m=>m.id!==id); await persistir(); render(); };\n\n\u002F\u002F ---------- Exportar \u002F Importar Excel (repositorio compartido) ----------\nconst EXCEL_HEADERS = [\n  'Titular','Signo Distintivo','Tipo','Subtipo','Clase','Estatus','Fecha de Rechazo','No. Expediente','No. Registro',\n  'Fecha Solicitud','Fecha Otorgamiento','Declaraci\u00f3n de Uso','Fecha DU',\n  '\u00daltimo Oficio - Tipo','\u00daltimo Oficio - Fecha','\u00daltimo Oficio - Contestado','\u00daltimo Oficio - Fecha de Contestaci\u00f3n',\n  'Pr\u00f3xima Renovaci\u00f3n','Comentarios','ID'\n];\nfunction marcaAFilas(m){\n  \u002F\u002F una fila por marca, usando el \u00faltimo oficio y la pr\u00f3xima renovaci\u00f3n como resumen\n  const oficios = Array.isArray(m.oficios) ? m.oficios : [];\n  const ultOficio = oficios.length ? oficios[oficios.length-1] : null;\n  const renovs = Array.isArray(m.renovaciones) ? m.renovaciones.filter(r=>r.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)) : [];\n  const proxRenov = renovs.length ? renovs[renovs.length-1].fecha : '';\n  return [\n    m.titular||'', m.signo||'', m.tipo||'', m.subtipo||'', m.clase||'', m.estatus||'', m.fechaRechazo||'', m.expediente||'', m.registro||'',\n    m.solicitud||'', m.otorg||'', (m.du?'S\u00ed':'No'), m.duFecha||'',\n    ultOficio ? ultOficio.tipo||'' : '',\n    ultOficio ? ultOficio.fecha||'' : '',\n    ultOficio ? (ultOficio.contestado?'S\u00ed':'No') : '',\n    ultOficio ? ultOficio.resp||'' : '',\n    proxRenov, m.comentarios||'', m.id||''\n  ];\n}\nfunction exportarExcel(){\n  const aoa = [EXCEL_HEADERS, ...marcas.map(marcaAFilas)];\n  const ws = XLSX.utils.aoa_to_sheet(aoa);\n  ws['!cols'] = EXCEL_HEADERS.map(()=>({wch:20}));\n  const wb = XLSX.utils.book_new();\n  XLSX.utils.book_append_sheet(wb, ws, 'Marcas');\n  const hoy = hoyISO();\n  XLSX.writeFile(wb, `Control_de_Marcas_Ceneca_${hoy}.xlsx`);\n}\nfunction filaAMarca(row, idx){\n  const get = (h)=> row[h] ?? '';\n  const oficioTipo = get('\u00daltimo Oficio - Tipo');\n  const oficioFecha = get('\u00daltimo Oficio - Fecha');\n  const oficios = (oficioTipo || oficioFecha) ? [{\n    tipo: TIPOS_OFICIO.includes(oficioTipo) ? oficioTipo : 'Otro',\n    fecha: oficioFecha||'',\n    contestado: String(get('\u00daltimo Oficio - Contestado')).trim().toLowerCase()==='s\u00ed' || String(get('\u00daltimo Oficio - Contestado')).trim().toLowerCase()==='si',\n    resp: get('\u00daltimo Oficio - Fecha de Contestaci\u00f3n')||''\n  }] : [];\n  const proxRenov = get('Pr\u00f3xima Renovaci\u00f3n');\n  const renovaciones = proxRenov ? [{fecha: proxRenov}] : [];\n  const du = String(get('Declaraci\u00f3n de Uso')).trim().toLowerCase()==='s\u00ed' || String(get('Declaraci\u00f3n de Uso')).trim().toLowerCase()==='si';\n  return {\n    id: get('ID') || ('m'+Date.now()+'_'+idx),\n    titular: get('Titular'), signo: get('Signo Distintivo'), tipo: get('Tipo')||'Marca',\n    subtipo: get('Subtipo')||'',\n    clase: String(get('Clase')||''), estatus: get('Estatus')||'En tr\u00e1mite',\n    fechaRechazo: normFechaExcel(get('Fecha de Rechazo')),\n    expediente: String(get('No. Expediente')||''), registro: String(get('No. Registro')||''),\n    solicitud: normFechaExcel(get('Fecha Solicitud')), otorg: normFechaExcel(get('Fecha Otorgamiento')),\n    oficios, du, duFecha: normFechaExcel(get('Fecha DU')), renovaciones,\n    comentarios: get('Comentarios')||''\n  };\n}\nfunction normFechaExcel(v){\n  if(!v) return '';\n  if(v instanceof Date) return v.toISOString().slice(0,10);\n  const s = String(v).trim();\n  const m = s.match(\u002F^(\\d{4})-(\\d{2})-(\\d{2})\u002F);\n  return m ? s.slice(0,10) : '';\n}\ndocument.getElementById('btnExportarExcel').onclick = exportarExcel;\ndocument.getElementById('buscador').addEventListener('input', e=>{\n  busqueda = norm(e.target.value);\n  visibleCount = 12;\n  render();\n});\n\ndocument.getElementById('calPrev').onclick = ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendario(); };\ndocument.getElementById('calNext').onclick = ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendario(); };\ndocument.getElementById('calPrevY').onclick = ()=>{ calDate.setFullYear(calDate.getFullYear()-1); renderCalendario(); };\ndocument.getElementById('calNextY').onclick = ()=>{ calDate.setFullYear(calDate.getFullYear()+1); renderCalendario(); };\ndocument.getElementById('calHoy').onclick = ()=>{ calDate = new Date(); calDate.setDate(1); renderCalendario(); };\ndocument.getElementById('calPicker').onchange = (e)=>{\n  const [y,mo] = e.target.value.split('-').map(Number);\n  if(y && mo){ calDate = new Date(y, mo-1, 1); renderCalendario(); }\n};\n\n\u002F\u002F ---------- subir documento (IA lee el documento y prellenar el form) ----------\nfunction toBase64(file){\n  return new Promise((res, rej)=>{\n    const r = new FileReader();\n    r.onload = ()=> res(r.result.split(',')[1]);\n    r.onerror = ()=> rej(new Error('No se pudo leer el archivo'));\n    r.readAsDataURL(file);\n  });\n}\nasync function extraerDatos(file){\n  const b64 = await toBase64(file);\n  const isPDF = file.type === 'application\u002Fpdf' || \u002F\\.pdf$\u002Fi.test(file.name);\n  const mediaType = isPDF ? 'application\u002Fpdf' : (file.type || 'image\u002Fjpeg');\n  const contentBlock = isPDF\n    ? { type:'document', source:{ type:'base64', media_type:'application\u002Fpdf', data:b64 } }\n    : { type:'image', source:{ type:'base64', media_type:mediaType, data:b64 } };\n  const system = 'Eres un asistente que extrae datos de documentos del IMPI (oficios, t\u00edtulos de registro, avisos de publicaci\u00f3n) '\n    + 'para marcas, avisos comerciales y nombres comerciales mexicanos. Responde \u00daNICAMENTE con un objeto JSON, sin texto adicional, '\n    + 'sin backticks, exactamente con estas claves: {\"tipo_documento\":\"oficio\"|\"titulo\"|\"otro\",'\n    + '\"tipo_signo\":\"Marca\"|\"Aviso comercial\"|\"Nombre comercial\"|null,\"signo\":string|null,\"titular\":string|null,'\n    + '\"clase\":string|null,\"expediente\":string|null,\"registro\":string|null,\"fecha_documento\":\"YYYY-MM-DD\"|null,'\n    + '\"fecha_otorgamiento\":\"YYYY-MM-DD\"|null,\"fecha_solicitud\":\"YYYY-MM-DD\"|null,'\n    + '\"tipo_oficio\":\"Requisito de forma\"|\"Anterioridad\"|\"Impedimento\"|\"Oposici\u00f3n\"|\"Otro\"|null}. '\n    + 'Si un dato no aparece en el documento, usa null. No inventes datos.';\n  const resp = await fetch('https:\u002F\u002Fapi.anthropic.com\u002Fv1\u002Fmessages', {\n    method:'POST', headers:{'Content-Type':'application\u002Fjson'},\n    body: JSON.stringify({\n      model:'claude-sonnet-4-6', max_tokens:1000, system,\n      messages:[{ role:'user', content:[contentBlock, {type:'text', text:'Extrae los datos de este documento.'}] }]\n    })\n  });\n  const data = await resp.json();\n  const texto = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\\n');\n  const limpio = texto.replace(\u002F```json|```\u002Fg,'').trim();\n  return JSON.parse(limpio);\n}\nfunction buscarCoincidencia(d){\n  return marcas.find(m =>\n    (d.expediente && m.expediente && norm(m.expediente)===norm(d.expediente)) ||\n    (d.registro && m.registro && norm(m.registro)===norm(d.registro)) ||\n    (d.signo && norm(m.signo)===norm(d.signo))\n  );\n}\nfunction aplicarExtraccion(d){\n  const match = buscarCoincidencia(d);\n  abrirForm(match || null);\n  const banner = document.getElementById('avisoIA');\n  banner.innerHTML = '<div class=\"aviso-ia\">Datos le\u00eddos autom\u00e1ticamente del documento \u2014 revisa antes de guardar.<\u002Fdiv>';\n\n  if(!match){\n    if(d.signo) document.getElementById('f_signo').value = d.signo;\n    if(d.tipo_signo) document.getElementById('f_tipo').value = d.tipo_signo;\n    if(d.titular) document.getElementById('f_titular').value = d.titular;\n    if(d.clase) document.getElementById('f_clase').value = d.clase;\n    if(d.expediente) document.getElementById('f_exp').value = d.expediente;\n    if(d.registro) document.getElementById('f_reg').value = d.registro;\n    if(d.fecha_solicitud) document.getElementById('f_solicitud').value = d.fecha_solicitud;\n  }\n  if(d.tipo_documento==='titulo' && d.fecha_otorgamiento){\n    document.getElementById('f_otorg').value = d.fecha_otorgamiento;\n    document.getElementById('f_estatus').value = 'Registrada';\n    if(!match && d.registro) document.getElementById('f_reg').value = d.registro;\n  }\n  if(d.tipo_documento==='oficio' && d.fecha_documento){\n    const a = leerOficiosDOM();\n    a.push({ tipo: TIPOS_OFICIO.includes(d.tipo_oficio) ? d.tipo_oficio : 'Otro', fecha:d.fecha_documento, contestado:false, resp:'' });\n    renderOficios(a);\n  }\n}\ndocument.getElementById('btnSubir').onclick = ()=> document.getElementById('filePicker').click();\ndocument.getElementById('filePicker').onchange = async (e)=>{\n  const file = e.target.files[0];\n  if(!file) return;\n  const btn = document.getElementById('btnSubir');\n  const original = btn.textContent;\n  btn.disabled = true; btn.textContent = 'Analizando documento\u2026';\n  try{\n    const datos = await extraerDatos(file);\n    aplicarExtraccion(datos);\n  }catch(err){\n    console.error(err);\n    abrirForm(null);\n    document.getElementById('avisoIA').innerHTML = '<div class=\"aviso-ia\">No se pudo leer el documento autom\u00e1ticamente. Ingresa los datos manualmente.<\u002Fdiv>';\n  }finally{\n    btn.disabled = false; btn.textContent = original;\n    e.target.value = '';\n  }\n};\n\n\u002F\u002F ---------- semilla + arranque ----------\nconst SEMILLA = [{\n  id:'ejemplo', signo:'EJEMPLO \u2014 Marca demostrativa', tipo:'Marca', titular:'Cliente Ejemplo, S.A. de C.V.',\n  clase:'35', estatus:'Registrada', expediente:'', registro:'', solicitud:'2023-02-10', otorg:'2023-06-01',\n  oficios:[], du:false, duFecha:'', renovaciones:[]\n}];\ndocument.getElementById('gSignIn').onclick = ()=>{\n  document.getElementById('gAuthMsg').textContent='Abriendo ventana de Google\u2026';\n  GAuth.signIn();\n};\nif(GAuth.getUser() && GAuth.getToken()){ GAuth.signIn(); }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
