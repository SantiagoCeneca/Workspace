<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0d0b08"/>
<title>Workspace · Cēneca</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink-0:#07060a;--ink-1:#0d0b08;--ink-2:#14110c;--ink-3:#1c1813;--ink-4:#2a241c;--ink-5:#3a3329;
  --paper:#f4eee2;--paper-soft:#d8d1c2;
  --mute:rgba(244,238,226,.64);--dim:rgba(244,238,226,.44);--faint:rgba(244,238,226,.22);
  --line:rgba(244,238,226,.07);--line2:rgba(244,238,226,.12);
  --accent:#e8a24a;--accent-soft:#c98a3a;--accent-glow:rgba(232,162,74,.16);
  --red:#e08686;--red-l:rgba(224,134,134,.13);
  --blue:#8cb8d6;--blue-l:rgba(140,184,214,.13);
  --rose:#e3a1bf;--rose-l:rgba(227,161,191,.13);
  --green:#93c29a;--green-l:rgba(147,194,154,.13);
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",monospace;
  --r:8px;--rs:5px;
}
html,body{min-height:100%;background:var(--ink-1);color:var(--paper);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--accent-glow)}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:rgba(244,238,226,.09);border-radius:4px}

/* ── LOGIN ── */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(ellipse 80% 50% at 50% 0%,rgba(232,162,74,.07),transparent 70%),var(--ink-0)}
.auth-box{width:100%;max-width:360px;text-align:center}
.seal{width:120px;height:120px;margin:0 auto 34px;border:1px solid rgba(244,238,226,.4);border-radius:50%;display:grid;place-items:center;position:relative}
.seal::before{content:"";position:absolute;inset:7px;border:1px solid rgba(244,238,226,.15);border-radius:50%}
.seal span{font-family:var(--serif);font-size:64px;line-height:1;color:var(--paper-soft)}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.auth h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;margin-bottom:12px}
.auth p{color:var(--dim);font-size:13px;margin-bottom:30px}
.auth p em{font-style:normal;color:var(--mute)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;background:var(--paper);color:#1a1a1a;border-radius:5px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .15s}
.gbtn:hover{transform:translateY(-1px)}
.demo-btns{display:grid;gap:8px}
.auth-foot{margin-top:40px;font-size:10px;letter-spacing:.14em;color:var(--faint)}

/* ── TOP BAR ── */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:12px 28px;background:rgba(13,11,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative}
.burger{width:32px;height:32px;border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;margin-right:2px}
.burger:hover,.burger[aria-expanded="true"]{background:rgba(244,238,226,.07)}
.burger span{display:block;width:16px;height:1.5px;border-radius:1px;background:var(--paper-soft)}
.menu{position:absolute;top:calc(100% + 10px);left:0;width:240px;background:var(--ink-3);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px;z-index:80}
.menu-h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:8px 10px 6px}
.menu-i{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-size:13px;color:var(--mute);text-decoration:none}
.menu-i:hover{background:rgba(244,238,226,.06);color:var(--paper)}
.menu-i.on{background:var(--accent-glow);color:var(--paper)}
.menu-i svg{flex-shrink:0;opacity:.8}
.brand img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.wm{font-family:var(--serif);font-size:15px;letter-spacing:.28em}
.brand .sep{color:var(--faint)}
.brand .pg{font-size:13px;color:var(--mute);font-weight:500}
.views{display:flex;gap:2px;background:var(--ink-2);border:1px solid var(--line);padding:3px;border-radius:7px;margin-left:8px}
.views button{padding:6px 13px;border-radius:5px;font-size:12.5px;color:var(--mute);font-weight:500;white-space:nowrap}
.views button:hover{color:var(--paper)}
.views button.on{background:var(--ink-4);color:var(--paper)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.estado{font-size:11px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.estado.err{color:var(--red)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#1a1208;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.me{display:flex;align-items:center;gap:8px}
.link{font-size:12px;color:var(--dim)}.link:hover{color:var(--red)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--rs);border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--mute);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent-soft);color:var(--paper);background:rgba(232,162,74,.06)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1208;font-weight:700}
.btn.pri:hover{background:#f3b562}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--red);border-color:rgba(224,134,134,.25)}.btn.danger:hover{background:var(--red-l);border-color:var(--red)}
.icon{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--dim);font-size:18px;line-height:1;flex-shrink:0}
.icon:hover{background:rgba(244,238,226,.06);color:var(--paper)}
.icon.sm{width:24px;height:24px;font-size:15px}

/* ── MAIN ── */
.main{max-width:1440px;margin:0 auto;padding:26px 28px 80px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.hero h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1}
.hero .sub{font-size:12px;color:var(--dim);margin-top:4px}
.resumen{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.res-main{font-family:var(--serif);font-size:20px;margin-right:6px}
.res-main b{color:var(--accent);font-weight:500;font-size:26px}
.rchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;font-size:12px;border:1px solid var(--line2);color:var(--mute);background:var(--ink-2)}
.rchip b{font-weight:700;color:var(--paper)}
.rchip.red{border-color:rgba(224,134,134,.3);color:var(--red)}.rchip.red b{color:var(--red)}
.rchip.amb{border-color:rgba(232,162,74,.3);color:var(--accent)}.rchip.amb b{color:var(--accent)}
.rchip.ok{color:var(--green);border-color:rgba(147,194,154,.25)}

/* captura rápida */
.captura{display:flex;gap:8px;align-items:stretch;background:var(--ink-2);border:1px solid var(--line2);border-radius:10px;padding:6px;margin-bottom:12px;transition:border-color .15s}
.captura:focus-within{border-color:rgba(232,162,74,.45)}
.captura .plus{display:grid;place-items:center;width:34px;color:var(--accent);font-size:20px}
.captura input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:14.5px;padding:8px 4px}
.captura input::placeholder{color:var(--dim)}
.cap-opts{display:flex;gap:6px;align-items:center}
.sel-mini{background:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--mute);outline:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-mini:hover{color:var(--paper);border-color:var(--line2)}
.sel-mini option{background:var(--ink-2)}

/* filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:160px;max-width:300px;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:12.5px;outline:none}
.search:focus{border-color:rgba(232,162,74,.4)}
.search::placeholder{color:var(--dim)}
.f-clear{font-size:12px;color:var(--accent)}

/* ── TABLERO ── */
.coltabs{display:none}
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--ink-0);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:260px;transition:border-color .15s,background .15s}
.col.drag{border-color:rgba(232,162,74,.5);background:rgba(232,162,74,.035)}
.col-h{display:flex;align-items:center;gap:9px;padding:2px 4px 12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-santiago{background:var(--blue)}.d-elizabeth{background:var(--rose)}.d-espera{background:var(--accent)}.d-otro{background:var(--green)}
.col-h h2{font-size:13px;font-weight:600;letter-spacing:.01em}
.col-h .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--ink-3);padding:1px 7px;border-radius:100px}
.col-h .csub{font-size:11px;color:var(--dim);margin-left:auto}
.cards{display:flex;flex-direction:column;gap:8px}
.empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:12.5px;border:1px dashed var(--line2);border-radius:9px}
.grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 4px 2px}

.card{position:relative;background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px 10px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2);background:var(--ink-3)}
.card.dragging{opacity:.45}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.card.p-urgente::before{background:var(--red)}
.card.p-alta::before{background:var(--accent)}
.card.p-media::before{background:var(--blue)}
.card.p-baja::before{background:var(--faint)}
.c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.c-tags:empty{display:none}
.tag{font-size:10.5px;padding:2px 8px;border-radius:100px;font-weight:600;letter-spacing:.02em;border:1px solid transparent}
.t-mot{background:var(--accent-glow);color:var(--accent);border-color:rgba(232,162,74,.22)}
.t-warn{background:var(--red-l);color:var(--red);border-color:rgba(224,134,134,.25)}
.t-esp{background:rgba(244,238,226,.06);color:var(--paper-soft);border-color:var(--line2)}
.t-urg{background:var(--red-l);color:var(--red)}
.t-urgente{background:var(--red-l);color:var(--red)}.t-media{background:var(--blue-l);color:var(--blue)}
.t-alta{background:rgba(232,162,74,.1);color:var(--accent)}
.t-baja{color:var(--dim);border-color:var(--line)}
.c-title{font-size:13.5px;font-weight:500;line-height:1.38;color:var(--paper);word-wrap:break-word}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--dim)}
.c-meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:4px;background:rgba(244,238,226,.06);color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ghost{background:none;border:1px solid var(--line2)}
.due{font-family:var(--mono);font-size:11px;color:var(--mute)}
.due.ov{color:var(--red)}.due.hoy{color:var(--accent)}
.mini{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px}
.mini.done{color:var(--green)}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.age{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pass{font-size:11.5px;font-weight:600;color:var(--accent);padding:3px 9px;border-radius:5px;border:1px solid rgba(232,162,74,.25);flex-shrink:0}
.pass:hover{background:var(--accent-glow);border-color:var(--accent)}

/* ── LISTA ── */
.tbl-wrap{background:var(--ink-0);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:11px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--paper)}
th.s::after{content:" ↓";color:var(--accent)}th.s.up::after{content:" ↑"}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(244,238,226,.025)}
tr:last-child td{border-bottom:none}
.td-t{font-weight:500;max-width:340px}
.holder{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.muted{color:var(--dim)}

/* ── TERMINADAS ── */
.done-list{background:var(--ink-0);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.done-day{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:16px 0 6px}
.done-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.done-row:last-child{border-bottom:none}
.done-row .ok{width:18px;height:18px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;font-size:11px;flex-shrink:0}
.done-row .dt{flex:1;min-width:0}
.done-row .dt div:first-child{font-size:13px;color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.done-row .dm{font-size:11px;color:var(--dim);margin-top:2px}

/* ── DRAWER ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--ink-2);border-left:1px solid var(--line2);z-index:70;overflow-y:auto;padding:16px 26px 60px;box-shadow:-20px 0 60px rgba(0,0,0,.4);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dw-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:-16px;background:var(--ink-2);padding:6px 0;z-index:2}
.dw-act{display:flex;gap:6px;align-items:center}
.dw-title{width:100%;background:none;border:none;outline:none;resize:none;font-family:var(--serif);font-size:28px;line-height:1.18;color:var(--paper);overflow:hidden;margin-bottom:14px}
.props{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;margin-bottom:22px;font-size:13px}
.pk{color:var(--dim);padding:7px 0;font-size:12.5px}
.pv{padding:4px 8px;margin-left:-8px;border-radius:5px;min-height:31px;display:flex;align-items:center;gap:6px;text-align:left;width:100%}
button.pv:hover,.pv-in:hover{background:rgba(244,238,226,.05)}
.pv-in{background:none;border:none;outline:none;font-size:13px;padding:5px 8px;margin-left:-8px;border-radius:5px;color-scheme:dark;width:auto;max-width:100%}
.pv-in option{background:var(--ink-2)}
.ph{color:var(--faint)}
.dsec{margin-bottom:24px}
.dsec h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dsec h4 span{font-family:var(--mono);letter-spacing:0;color:var(--mute)}
.notas{width:100%;min-height:90px;background:var(--ink-1);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:13px;line-height:1.6;outline:none;resize:vertical}
.notas:focus{border-color:rgba(232,162,74,.35)}
.progress{height:4px;background:var(--ink-4);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--green);transition:width .2s}
.st{display:flex;align-items:center;gap:8px;padding:3px 0}
.ck{width:18px;height:18px;border-radius:4px;border:1.5px solid rgba(244,238,226,.28);flex-shrink:0;display:grid;place-items:center;font-size:11px;color:#1a1208}
.ck:hover{border-color:var(--accent)}
.ck.on{background:var(--green);border-color:var(--green)}
.st-t{flex:1;background:none;border:none;outline:none;font-size:13px;padding:5px 4px;border-radius:4px}
.st-t:focus{background:var(--ink-1)}
.st.on .st-t{text-decoration:line-through;color:var(--dim)}
.st .icon{opacity:0}.st:hover .icon{opacity:1}
.addin{width:100%;background:none;border:1px dashed var(--line2);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;margin-top:6px}
.addin:focus{border-style:solid;border-color:rgba(232,162,74,.35)}
.addin::placeholder{color:var(--dim)}
.com{display:flex;gap:10px;padding:8px 0}
.com .avatar{width:26px;height:26px;font-size:10px}
.com .avatar.av-elizabeth{background:linear-gradient(135deg,var(--rose),#b9799a)}
.com .avatar.av-santiago{background:linear-gradient(135deg,var(--blue),#5d8fb0)}
.com-b{flex:1;min-width:0}
.com-m{font-size:11px;color:var(--dim)}.com-m b{color:var(--mute);font-weight:600}
.com-t{font-size:13px;white-space:pre-wrap;word-wrap:break-word;margin-top:1px}
.hist{border-left:1px solid var(--line2);margin-left:5px;padding-left:16px}
.hi{position:relative;padding:5px 0;font-size:12px;color:var(--mute)}
.hi::before{content:"";position:absolute;left:-20px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--ink-5)}
.hi .when{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:4px}
.dw-foot{display:flex;gap:8px;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line)}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.mb{background:var(--ink-2);border:1px solid var(--line2);border-radius:12px;padding:24px;width:470px;max-width:100%;max-height:90vh;overflow-y:auto}
.mt{font-family:var(--serif);font-size:24px;line-height:1.15;margin-bottom:4px}
.msub{font-size:12.5px;color:var(--dim);margin-bottom:18px}
.msg{background:var(--green-l);color:var(--green);border-radius:7px;padding:9px 12px;font-size:12.5px;margin-bottom:16px}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:16px 0 8px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 12px;border-radius:7px;border:1px solid var(--line2);font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.opt:hover{color:var(--paper);border-color:var(--faint)}
.opt.on{border-color:var(--accent);background:var(--accent-glow);color:var(--paper)}
.opt.sm{padding:5px 10px;font-size:12px}
.fi{width:100%;background:var(--ink-1);border:1px solid var(--line2);border-radius:6px;padding:9px 11px;font-size:13px;outline:none}
.fi:focus{border-color:rgba(232,162,74,.4)}
textarea.fi{resize:vertical;min-height:60px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.cat-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.cat-row .fi{padding:7px 10px;flex:1;min-width:0}
.cat-row .n{font-family:var(--mono);font-size:11px;color:var(--dim);width:22px;text-align:right;flex-shrink:0}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}

/* ── POPOVER (combobox) ── */
.pop{position:fixed;z-index:100;width:260px;background:var(--ink-3);border:1px solid var(--line2);border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px}
.pop input{width:100%;background:var(--ink-1);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;margin-bottom:4px}
.pop-l{max-height:240px;overflow-y:auto}
.pop-o{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:5px;font-size:13px;color:var(--mute)}
.pop-o:hover,.pop-o.hl{background:rgba(244,238,226,.07);color:var(--paper)}
.pop-o.sel::after{content:"✓";margin-left:auto;color:var(--accent)}
.pop-o.new{color:var(--accent)}
.pop-o .ph{font-style:italic}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-4);color:var(--paper);border:1px solid var(--line2);padding:10px 12px 10px 16px;border-radius:8px;font-size:13px;z-index:120;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast span{min-width:150px}.toast button{white-space:nowrap;color:var(--accent);font-weight:700;font-size:12.5px;padding:3px 6px}


/* horas */
.hr-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hr-row .hd{font-family:var(--mono);font-size:11px;color:var(--dim);width:52px;flex-shrink:0}
.hr-row .hi2{font-family:var(--mono);font-size:11px;color:var(--mute);width:34px;flex-shrink:0}
.hr-row .ht{flex:1;min-width:0;color:var(--paper-soft)}
.hr-row .hh{font-family:var(--mono);font-size:12px;color:var(--accent);flex-shrink:0}
.hr-row .icon{opacity:0}.hr-row:hover .icon{opacity:1}
.hr-add{display:grid;grid-template-columns:auto auto 74px 1fr auto;gap:6px;margin-top:8px;align-items:center}
.hr-add .fi{padding:7px 9px;font-size:12.5px;color-scheme:dark}
.hr-chips{display:flex;gap:4px;margin-top:6px}
.hr-tot{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px}
.hr-tot b{font-family:var(--mono);color:var(--paper)}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.rep-grid label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px}
.rep-tbl{margin-top:16px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;font-size:12px}
.rep-tbl table{min-width:0}
.rep-tbl td,.rep-tbl th{padding:7px 9px}
.rep-sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mb.wide{width:720px}
@media(max-width:760px){.hr-add{grid-template-columns:1fr 1fr}.hr-add .fi.desc{grid-column:1/-1}.rep-grid{grid-template-columns:1fr}}

/* ── RESPONSIVE ── */
@media(max-width:1000px){
  .top{padding:10px 16px;gap:10px;flex-wrap:wrap}
  .brand .sep,.brand .pg{display:none}
  .views{order:3;width:100%;margin-left:0;justify-content:stretch}
  .views button{flex:1}
  .top-r .btn .lbl-l{display:none}
  .main{padding:18px 16px 90px}
}
@media(max-width:760px){
  .hero h1{font-size:28px}
  .resumen{width:100%}
  .captura{flex-wrap:wrap}
  .captura input{flex:1 1 calc(100% - 50px)}
  .cap-opts{width:100%;padding:0 4px 2px}
  .cap-opts .sel-mini{flex:1;max-width:none}
  .coltabs{display:flex;gap:4px;margin-bottom:12px;background:var(--ink-2);padding:3px;border-radius:8px;border:1px solid var(--line)}
  .coltabs button{flex:1;padding:8px 6px;border-radius:6px;font-size:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
  .coltabs button span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .coltabs button.on{background:var(--ink-4);color:var(--paper)}
  .board{grid-template-columns:1fr}
  .col{display:none;padding:10px}
  .col.act{display:block}
  .col-h{display:none}
  .drawer{padding:12px 16px 60px}
  .props{grid-template-columns:100px 1fr}
  .dw-title{font-size:24px}
  .cat-grid{grid-template-columns:1fr}
  .estado{display:none}
  .search{max-width:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="auth" class="auth">
  <div class="auth-box">
    <div class="seal"><span>C</span></div>
    <div class="eyebrow">Cēneca · Firma jurídica</div>
    <h1>Workspace</h1>
    <p id="auth-desc">Entra con tu cuenta <em>@ceneca.com.mx</em> para ver y pasar tareas.</p>
    <div id="auth-btns">
      <button class="gbtn" id="signin" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continuar con Google
      </button>
    </div>
    <div class="auth-foot">© CĒNECA</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">
      <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
      <img src="favicon.png" alt=""/><span class="wm">CĒNECA</span><span class="sep">/</span><span class="pg">Workspace</span>
      <nav class="menu hidden" id="menu" aria-label="Menú">
        <div class="menu-h">Menú</div>
        <a class="menu-i on" href="index.html"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5" height="13" rx="1.2"/><rect x="9.5" y="1.5" width="5" height="8" rx="1.2"/></svg>Pendientes</a>
        <a class="menu-i" href="marcas.html"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5"/><path d="M1.5 6.5h13M5 1v3M11 1v3" stroke-linecap="round"/></svg>Calendario de marcas</a>
        <button class="menu-i" data-act="horas"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8.5" r="6"/><path d="M8 5.2v3.5l2.3 1.5M6.3 1.5h3.4" stroke-linecap="round"/></svg>Cómputo de horas</button>
      </nav>
    </div>
    <nav class="views" id="views">
      <button data-act="vista" data-v="tablero">Tablero</button>
      <button data-act="vista" data-v="lista">Lista</button>
      <button data-act="vista" data-v="terminadas">Terminadas</button>
    </nav>
    <div class="top-r">
      <span id="estado" class="estado"></span>
      <button class="btn sm" data-act="catalogo" title="Clientes y áreas"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="5" r="2.6"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4M11 3a2.4 2.4 0 010 4.6M12.5 9.6c1.2.5 2 1.6 2 3.4" stroke-linecap="round"/></svg> <span class="lbl-l">Clientes y áreas</span></button>
      <div class="me"><div id="avatar" class="avatar"></div><button class="link" id="signout">Salir</button></div>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div><h1 id="saludo"></h1><div id="fecha" class="sub"></div></div>
      <div id="resumen" class="resumen"></div>
    </section>

    <form id="captura" class="captura" autocomplete="off">
      <span class="plus">+</span>
      <input id="cap-t" placeholder="Escribe una tarea y presiona Enter…  ej. Contestar correo de GEPSA"/>
      <div class="cap-opts">
        <select id="cap-para" class="sel-mini" title="¿Para quién?"></select>
        <button type="button" id="cap-cli" class="sel-mini" data-act="combo-cap">Sin cliente</button>
        <button type="submit" class="btn pri sm">Agregar</button>
      </div>
    </form>

    <div id="filtros" class="filtros"></div>
    <div id="vista"></div>
  </main>
</div>

<div id="scrim" class="scrim hidden" data-act="cerrar-dw"></div>
<aside id="drawer" class="drawer hidden" aria-label="Detalle de la tarea"></aside>
<div id="modal" class="mo hidden"><div class="mb" id="modalbox"></div></div>
<div id="pop" class="pop hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
