:root{--bg:#f8f7f4;--surface:#fff;--surface2:#f2f1ee;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--text:#1a1917;--text2:#6b6962;--text3:#a09d97;--accent:#1D9E75;--accent-l:#e1f5ee;--accent-d:#0f6e56;--blue:#378ADD;--blue-l:#e6f1fb;--red:#E24B4A;--red-l:#fcebeb;--amber:#EF9F27;--amber-l:#faeeda;--r:10px;--rs:6px;--rl:14px;--sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 12px rgba(0,0,0,.1)}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
/* AUTH */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:48px 40px;width:380px;text-align:center;box-shadow:var(--shm)}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;font-size:22px;font-weight:500;letter-spacing:-.5px}
.auth-firm{font-size:13px;color:var(--text2);margin-bottom:28px;letter-spacing:.3px}
.auth-note{color:var(--text3);font-size:12px;margin-top:16px}
.lm{width:28px;height:28px;background:var(--accent);border-radius:8px;position:relative;flex-shrink:0}
.lm::after{content:'';position:absolute;inset:5px;background:#fff;border-radius:3px;opacity:.4}
.lm.sm{width:22px;height:22px;border-radius:6px}.lm.sm::after{inset:4px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s}
.google-btn:hover{background:var(--surface2)}
/* APP */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px}
.sidebar-top{padding:0 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.ws-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;letter-spacing:-.3px;margin-bottom:4px}
.ws-domain{font-size:11px;color:var(--text3);padding-left:30px;margin-bottom:10px}
.user-pill{font-size:12px;color:var(--text2)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);color:var(--text2);font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .12s}
.ni:hover{background:var(--surface2);color:var(--text)}
.ni.active{background:var(--accent-l);color:var(--accent-d);font-weight:500}
.ni svg{opacity:.7;flex-shrink:0}.ni.active svg{opacity:1}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500}
.sidebar-bottom{padding-top:12px;border-top:1px solid var(--border)}
.so-btn{width:100%;padding:8px;border-radius:var(--rs);border:none;background:none;color:var(--text3);font-size:13px;cursor:pointer;text-align:left;font-family:inherit;transition:color .12s}
.so-btn:hover{color:var(--red)}
.main{flex:1;overflow-y:auto}
.view{display:none;padding:32px 36px}.view.active{display:block}
/* TYPOGRAPHY */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
.pt{font-size:22px;font-weight:500;letter-spacing:-.5px}
.psub{font-size:13px;color:var(--text2);margin-top:2px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
.btn:hover{background:var(--surface2)}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff}.btnp:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btns{padding:5px 12px;font-size:12px}
.btnd{color:var(--red);border-color:var(--red-l)}.btnd:hover{background:var(--red-l)}
/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.sn{font-size:28px;font-weight:300;letter-spacing:-1px;font-family:'DM Mono',monospace}
.sl{font-size:12px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slabel{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
/* TASKS */
.ti{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.ti:last-child{border-bottom:none}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ck.done{background:var(--accent);border-color:var(--accent)}
.ck.done::after{content:'';display:block;width:5px;height:8px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{flex:1;min-width:0}
.tn{font-size:13.5px}.tn.done{text-decoration:line-through;color:var(--text3)}
.tmr{display:flex;gap:8px;margin-top:2px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.tg{background:var(--accent-l);color:var(--accent-d)}.tb{background:var(--blue-l);color:#185FA5}.tgr{background:var(--surface2);color:var(--text2)}.tr{background:var(--red-l);color:#A32D2D}
.dd{font-size:11px;color:var(--text3)}.dd.ov{color:var(--red)}
.tact{display:flex;gap:4px;opacity:0;transition:opacity .12s}.ti:hover .tact,.frow:hover .fract{opacity:1}
.ibtn{width:26px;height:26px;border-radius:var(--rs);border:none;background:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s}
.ibtn:hover{background:var(--surface2);color:var(--text)}
/* FORMS */
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13.5px;color:var(--text);background:var(--surface);outline:none;font-family:inherit;transition:border-color .12s}
.fi:focus{border-color:var(--accent)}
textarea.fi{resize:vertical;min-height:80px}
/* CALENDAR */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cmt{font-size:16px;font-weight:500}
.cnb{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.cnb:hover{background:var(--surface2)}
.calh{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.calh div{font-size:11px;font-weight:500;color:var(--text3);text-align:center;padding:4px;text-transform:uppercase}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--r);overflow:hidden}
.cday{background:var(--surface);padding:8px;min-height:80px}.cday.other{background:var(--bg)}.cday.today{background:#f0fdf8}
.dnum{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.cday.today .dnum{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cev{font-size:11px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cevg{background:var(--accent-l);color:var(--accent-d)}.cevb{background:var(--blue-l);color:#185FA5}
/* FILES */
.ft{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.si{flex:1;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13px;outline:none;background:var(--surface);font-family:inherit}
.si:focus{border-color:var(--accent)}
.bc{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-size:13px;color:var(--text2)}
.bc a{color:var(--accent);text-decoration:none;cursor:pointer}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rs);cursor:pointer;transition:background .1s}
.frow:hover{background:var(--surface2)}
.fic{font-size:18px;flex-shrink:0}.fnm{flex:1;font-size:13.5px}.fmt{font-size:12px;color:var(--text3)}
.fract{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.uz{border:2px dashed var(--border2);border-radius:var(--r);padding:32px;text-align:center;color:var(--text2);cursor:pointer;margin-bottom:20px;transition:all .15s}
.uz:hover,.uz.drag{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d)}
/* CLIENTS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;cursor:pointer;transition:all .12s}
.ccard:hover{box-shadow:var(--shm);transform:translateY(-1px)}
.cav{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:12px}
.cnm{font-size:15px;font-weight:500;margin-bottom:3px}.csb{font-size:12px;color:var(--text2);margin-bottom:12px}
.cst{display:flex;gap:12px}.csi{font-size:12px;color:var(--text3)}.csi strong{color:var(--text2);font-weight:500}
.sbadge{display:inline-flex;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.sact{background:var(--accent-l);color:var(--accent-d)}.sinact{background:var(--surface2);color:var(--text3)}
/* ACTIVITY */
.ai{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.ai:last-child{border-bottom:none}
.adot{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px}
.at{font-size:13.5px;line-height:1.5}.at strong{font-weight:500}.atm{font-size:12px;color:var(--text3);margin-top:2px}
/* NOTES */
.nlay{display:grid;grid-template-columns:240px 1fr;gap:20px;height:calc(100vh - 140px)}
.nsb{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-y:auto}
.nit{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.nit:hover{background:var(--surface2)}.nit.active{background:var(--accent-l)}
.nitt{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nit.active .nitt{color:var(--accent-d)}
.nip{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nid{font-size:11px;color:var(--text3);margin-top:3px}
.ned{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.neh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.nti{flex:1;font-size:15px;font-weight:500;border:none;outline:none;background:transparent;font-family:inherit}
.nbi{flex:1;padding:16px;font-size:13.5px;border:none;outline:none;resize:none;background:transparent;font-family:inherit;line-height:1.7}
/* INBOX */
.email-row{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.email-row:hover{background:var(--surface2)}.email-row.unread{background:#fafdfb}
.eav{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;background:var(--accent-l);color:var(--accent-d)}
.efrom{font-size:13.5px;font-weight:500}.esubj{font-size:13px;color:var(--text)}.eprev{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etime{font-size:11px;color:var(--text3);flex-shrink:0}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.mb{background:var(--surface);border-radius:var(--rl);padding:28px;width:460px;max-width:90vw;box-shadow:var(--shm);max-height:90vh;overflow-y:auto}
.mt{font-size:17px;font-weight:500;margin-bottom:20px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:2000;box-shadow:var(--shm)}
/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.eic{font-size:36px;margin-bottom:12px;opacity:.5}.etitle{font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px}.esub{font-size:13px;color:var(--text3)}
/* MISC */
.banner{background:var(--blue-l);border:1px solid #B5D4F4;border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;font-size:13px;color:#185FA5}
.divider{height:1px;background:var(--border);margin:20px 0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
@media(max-width:768px){.sidebar{width:60px}.ws-logo span,.ws-domain,.ni span,.sidebar-bottom,.user-pill{display:none}.ni{justify-content:center}.two,.nlay{grid-template-columns:1fr}.view{padding:20px 16px}}

/* ── CORDILLERA LOGIN SCREEN ─────────────────────────────── */
:root{
  --ink-0:#07060a;--ink-1:#0d0b08;--ink-2:#14110c;--ink-3:#1c1813;--ink-4:#2a241c;
  --paper-c:#f4eee2;--paper-soft:#d8d1c2;--paper-mute:rgba(244,238,226,0.62);
  --paper-dim:rgba(244,238,226,0.42);--paper-faint:rgba(244,238,226,0.22);
  --gold:#e8a24a;--gold-soft:#c98a3a;--gold-glow:rgba(232,162,74,0.18);
  --serif-c:"Cormorant Garamond","Times New Roman",serif;
  --script-c:"Pinyon Script",cursive;
  --mono-c:"JetBrains Mono",monospace;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.rise{animation:rise .6s ease-out both}
.rise-1{animation-delay:.05s}.rise-2{animation-delay:.15s}.rise-3{animation-delay:.25s}
.rise-4{animation-delay:.35s}.rise-5{animation-delay:.45s}

/* Auth override — full viewport Cordillera */
#auth.auth-screen{
  min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;
  align-items:stretch;background:var(--ink-0);padding:0;
}

/* ── Left column: scene ── */
.cord-left{
  position:relative;overflow:hidden;
  border-right:1px solid rgba(244,238,226,0.08);
}
.cord-scene{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 110%,rgba(232,162,74,.08),transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 78%,rgba(180,140,90,.10),transparent 70%),
    linear-gradient(180deg,#0a0907 0%,#100d0a 45%,#07060a 100%);
}
.cord-scene::before{
  content:"";position:absolute;left:-5%;right:-5%;bottom:22%;height:38%;
  background:linear-gradient(180deg,rgba(50,42,33,.55),rgba(20,17,13,.85));
  clip-path:polygon(0% 100%,0% 62%,8% 48%,14% 55%,22% 38%,30% 52%,38% 40%,48% 30%,56% 46%,66% 32%,74% 44%,84% 36%,92% 48%,100% 38%,100% 100%);
  filter:blur(2px);
}
.cord-scene::after{
  content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:32%;
  background:linear-gradient(180deg,rgba(6,5,8,.75),#050407 90%);
  clip-path:polygon(0% 100%,0% 70%,10% 55%,18% 64%,28% 42%,38% 60%,50% 38%,60% 56%,70% 44%,82% 60%,92% 48%,100% 60%,100% 100%);
}
.cord-mist{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 30% at 50% 62%,rgba(244,238,226,.06),transparent 70%),
    radial-gradient(ellipse 40% 18% at 30% 68%,rgba(244,238,226,.04),transparent 70%);
}
.cord-grain{
  position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.82 0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.cord-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%);
}
.cord-left-tag{
  position:absolute;top:24px;left:28px;z-index:2;
  display:flex;align-items:center;gap:10px;
  font-family:var(--sans);font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;color:rgba(244,238,226,.42);
}
.cord-left-center{
  position:absolute;inset:0;display:grid;place-items:center;z-index:2;
}
.cord-emblem{
  display:flex;flex-direction:column;align-items:center;gap:36px;
  animation:rise .6s ease-out both;
}
/* Emblem seal */
.cord-seal{
  position:relative;width:220px;height:220px;
  color:rgba(244,238,226,.85);
  filter:drop-shadow(0 0 24px rgba(244,238,226,.10)) drop-shadow(0 0 60px rgba(232,162,74,.08));
}
.cord-seal .ring{position:absolute;inset:0;border:1px solid currentColor;border-radius:50%;opacity:.55;}
.cord-seal .ring-i{position:absolute;inset:8px;border:1px solid currentColor;border-radius:50%;opacity:.22;}
.cord-seal .cross-v{position:absolute;left:50%;top:14%;bottom:14%;width:1px;transform:translateX(-.5px);background:currentColor;opacity:.55;}
.cord-seal .cross-h{position:absolute;top:50%;left:14%;right:14%;height:1px;transform:translateY(-.5px);background:currentColor;opacity:.55;}
.cord-seal .tick{position:absolute;background:currentColor;opacity:.7;}
.cord-seal .tick.t{left:50%;top:5%;width:1px;height:6px;transform:translateX(-.5px);}
.cord-seal .tick.b{left:50%;bottom:5%;width:1px;height:6px;transform:translateX(-.5px);}
.cord-seal .tick.l{top:50%;left:5%;height:1px;width:6px;transform:translateY(-.5px);}
.cord-seal .tick.r{top:50%;right:5%;height:1px;width:6px;transform:translateY(-.5px);}
.cord-seal .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.7;}
.cord-seal .dot.tl{left:22%;top:22%;}.cord-seal .dot.tr{right:22%;top:22%;}
.cord-seal .dot.bl{left:22%;bottom:22%;}.cord-seal .dot.br{right:22%;bottom:22%;}
.cord-seal .letter-c{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif-c);font-size:120px;font-weight:400;line-height:1;
  color:currentColor;
}
.cord-seal svg.curve{position:absolute;inset:0;width:100%;height:100%;opacity:.7;}
.cord-quote{text-align:center;}
.cord-quote .eyebrow-c{
  font-family:var(--sans);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(244,238,226,.42);margin-bottom:12px;
}
.cord-quote blockquote{
  font-family:var(--serif-c);font-size:20px;font-style:italic;
  color:var(--paper-soft);line-height:1.4;max-width:340px;
}
.cord-quote cite{
  display:block;font-size:10px;color:rgba(244,238,226,.42);
  margin-top:14px;letter-spacing:.18em;text-transform:uppercase;font-style:normal;
}
.cord-left-footer{
  position:absolute;bottom:24px;left:28px;right:28px;z-index:2;
  display:flex;justify-content:space-between;
  color:rgba(244,238,226,.22);font-size:10px;letter-spacing:.16em;
  font-family:var(--sans);
}

/* ── Right column: login ── */
.cord-right{
  background:var(--ink-1);position:relative;
  display:flex;flex-direction:column;color:var(--paper-c);
}
.cord-right::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(232,162,74,.06),transparent 70%);
}
.cord-right-header{
  padding:22px 32px;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;border-bottom:1px solid rgba(244,238,226,.05);
}
.cord-wordmark{
  font-family:var(--serif-c);font-size:18px;font-weight:400;
  letter-spacing:.32em;color:var(--paper-c);
}
.cord-wordmark .bar{position:relative;}
.cord-wordmark .bar::before{
  content:"";position:absolute;left:14%;right:-10%;top:-.12em;
  height:1.5px;background:var(--paper-c);
}
.cord-right-body{
  flex:1;display:grid;place-items:center;padding:40px 64px;position:relative;z-index:1;
}
.cord-form{width:100%;max-width:340px;}
.cord-eyebrow{
  font-family:var(--sans);font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(244,238,226,.42);margin-bottom:22px;
}
.cord-title{
  font-family:var(--serif-c);font-size:42px;line-height:1.05;
  letter-spacing:.005em;margin-bottom:14px;color:var(--paper-c);font-weight:400;
}
.cord-desc{
  font-family:var(--sans);font-size:13px;color:rgba(244,238,226,.42);
  line-height:1.6;margin-bottom:36px;
}
.cord-desc em{color:rgba(244,238,226,.62);font-style:normal;}
.cord-gbtn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;padding:14px 22px;background:var(--paper-c);color:#1a1a1a;
  border:none;border-radius:4px;font-family:var(--sans);font-size:14px;
  font-weight:500;letter-spacing:.02em;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.35);
  transition:transform .15s,box-shadow .15s;
}
.cord-gbtn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(0,0,0,.06),0 14px 32px rgba(0,0,0,.45);}
.cord-hr{height:1px;background:rgba(244,238,226,.08);border:0;margin:26px 0;}
.cord-footnote{
  font-size:11px;color:rgba(244,238,226,.42);line-height:1.6;margin-top:28px;
}
.cord-footnote a{color:var(--gold-soft);text-decoration:none;border-bottom:1px solid rgba(201,138,58,.4);}
.cord-right-footer{
  padding:18px 32px;border-top:1px solid rgba(244,238,226,.06);
  display:flex;justify-content:space-between;
  color:rgba(244,238,226,.22);font-size:10px;letter-spacing:.08em;
  font-family:var(--sans);position:relative;z-index:1;
}
.cord-right-footer span:last-child{font-family:var(--mono-c);}

/* Mobile fallback — single column */
@media(max-width:768px){
  #auth.auth-screen{grid-template-columns:1fr;}
  .cord-left{display:none;}
  .cord-right-body{padding:40px 32px;}
}

</style>
</head>
<body>
<!-- PANTALLA DE INICIO DE SESIÓN — Cordillera -->
<div id="auth" class="auth-screen">

  <!-- ── Columna izquierda: escena atmosférica + sello ── -->
  <div class="cord-left">
    <div class="cord-scene">
      <div class="cord-mist"></div>
      <div class="cord-grain"></div>
      <div class="cord-vignette"></div>
    </div>    <div class="cord-left-center">
      <div class="cord-emblem">
        <!-- Sello circular -->
        <div class="cord-seal">
          <div class="ring"></div>
          <div class="ring-i"></div>
          <div class="cross-v"></div>
          <div class="cross-h"></div>
          <span class="tick t"></span><span class="tick b"></span>
          <span class="tick l"></span><span class="tick r"></span>
          <span class="dot tl"></span><span class="dot tr"></span>
          <span class="dot bl"></span><span class="dot br"></span>
          <div class="letter-c">C</div>
          <svg class="curve" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
              <path id="top" d="M 110,110 m -88,0 a 88,88 0 0 1 176,0"/>
              <path id="bot" d="M 110,110 m 88,0 a 88,88 0 0 1 -176,0"/>
            </defs>
            <text fill="currentColor" style="font-family:'Cormorant Garamond',serif;letter-spacing:.5em;font-size:11px">
              <textPath href="#top" startOffset="20%">CÉNECA</textPath>
              <textPath href="#top" startOffset="68%">FIRMA</textPath>
            </text>
            <text fill="currentColor" style="font-family:'Cormorant Garamond',serif;letter-spacing:.5em;font-size:11px">
              <textPath href="#bot" startOffset="20%">CÉNECA</textPath>
              <textPath href="#bot" startOffset="68%">JURÍDICA</textPath>
            </text>
          </svg>
        </div>
        <!-- Cita -->
        <div class="cord-quote rise rise-2">
          <blockquote>"No es que tengamos poco tiempo,<br>sino que perdemos mucho."</blockquote>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Columna derecha: formulario de acceso ── -->
  <div class="cord-right">
    <header class="cord-right-header">
      <div class="cord-wordmark">C<span class="bar">Ē</span>NECA</div>
      <div style="font-size:11px;color:rgba(244,238,226,0.42);font-family:var(--sans)">ES</div>
    </header>

    <div class="cord-right-body">
      <div class="cord-form rise">
        <div class="cord-eyebrow rise rise-1">Acceso al workspace</div>
        <h1 class="cord-title rise rise-2">Bienvenido.</h1>
        <p class="cord-desc rise rise-3">
          Continúa con tu cuenta corporativa <em>@ceneca.com.mx</em> para entrar al workspace y gestionar tus proyectos.
        </p>
        <div class="rise rise-3">
          <button class="cord-gbtn" id="signin" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Continuar con Google
          </button>
        </div>

      </div>
    </div>

    <footer class="cord-right-footer">
      <span>© CĒNECA · Todos los derechos reservados</span>
      
    </footer>
  </div>

</div>

<!-- APP PRINCIPAL -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="ws-logo"><div class="lm sm"></div><span>Ceneca</span></div>
      <div class="ws-domain">ceneca.com.mx</div>
      <div class="user-pill" id="userpill"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-bottom"><button class="so-btn" id="signout">Cerrar sesión</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal" class="mo hidden"><div class="mb" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
